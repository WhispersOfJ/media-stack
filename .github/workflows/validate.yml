name: Validate Compose

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create dummy .env
        # docker compose config needs the vars referenced in compose to resolve
        # (doesn't need real values - this just validates YAML/schema, not secrets).
        run: cp .env.example .env

      - name: Validate default profile
        run: docker compose config --quiet

      - name: Check every compose ${VAR} has a .env.example key
        # docker compose config doesn't fail on an undefined var - it silently
        # substitutes an empty string. This catches that class of bug directly
        # (e.g. a new service added with a var never added to .env.example).
        run: |
          comm -23 \
            <(grep -ohE '\$\{[A-Z_0-9]+' docker-compose.yml | sed 's/^\${//' | sort -u) \
            <(grep -E '^[A-Z_0-9]+=' .env.example | cut -d= -f1 | sort -u) \
            > missing_vars.txt
          if [ -s missing_vars.txt ]; then
            echo "Vars referenced in docker-compose.yml but missing from .env.example:"
            cat missing_vars.txt
            exit 1
          fi

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
          scandir: "."
          ignore_paths: >-
            config media usenet

      - name: Ruff
        # scripts/ and the script/fish/systemd test suite. The retired
        # FastAPI control-panel/ tree was archived from the repo; the live
        # backend lives in control-panel-django/ (tested below).
        run: |
          pip install ruff==0.8.6
          ruff check scripts/ tests/

      - name: BUG-SMASHED.md smoke test
        # Verify the bug-graph script runs without errors against the
        # current git log. The checked-in BUG-SMASHED.md is a snapshot;
        # regenerate locally with:
        #   python3 scripts/generate-bug-graph.py --commits 300
        run: python3 scripts/generate-bug-graph.py --repo . --output /dev/null --commits 300

      - name: Unit tests - scripts, fish, and systemd
        run: |
          pip install -r requirements-dev.txt
          pytest tests/scripts tests/test_fish_naming.py \
            tests/test_fish_functions_installed.py tests/test_systemd_units.py

      - name: Unit tests - Django control panel
        run: |
          pip install -r control-panel-django/requirements.txt
          cd control-panel-django
          CONTROL_PANEL_SECRET_KEY=ci-test-secret pytest

      - name: Build installer image
        # Build-only, no push (no registry credentials here) - just catches a
        # broken Dockerfile/entrypoint before merge. Actual publish happens
        # in publish-installer.yml on push to main.
        run: docker build -t media-stack-installer:ci .
