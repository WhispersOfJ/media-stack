name: Claude Code Review

on:
  # pull_request, not pull_request_target: tried pull_request_target to work around
  # GitHub withholding secrets from pull_request runs triggered by dependabot[bot] (see
  # CHANGELOG v6.0.1) - that part worked, CLAUDE_CODE_OAUTH_TOKEN was read correctly, but
  # anthropics/claude-code-action's own OIDC-based GitHub App token exchange then failed
  # ("401 Unauthorized - Invalid OIDC token") specifically under pull_request_target's
  # token claims. Reverted rather than dig into Anthropic's backend validation. Net effect:
  # this still won't auto-fire on Dependabot-authored PRs, same as before - the working
  # alternative is a manual `@claude` comment on the PR (confirmed working, triggers
  # claude.yml instead).
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Scoped to Dependabot specifically (not '*') - this repo is private so the
          # wildcard's "external Apps on public repos" risk doesn't strictly apply, but
          # there's no reason to trust every bot when only one actually needs to trigger
          # this. Dependabot's own PRs (opening a version-bump PR) were failing with
          # "Workflow initiated by non-human actor" before this was added.
          allowed_bots: 'dependabot[bot]'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

