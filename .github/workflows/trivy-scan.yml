name: Trivy Image Security Scan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docker-compose.yml'
      - '.github/workflows/trivy-scan.yml'
  push:
    branches:
      - main
    paths:
      - 'docker-compose.yml'
      - '.github/workflows/trivy-scan.yml'
  schedule:
    # Weekly scan (Sunday 2 AM UTC)
    - cron: '0 2 * * 0'

jobs:
  scan:
    runs-on: ubuntu-latest
    name: Scan Images for CVEs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update && sudo apt-get install -y wget apt-transport-https
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Extract images from docker-compose.yml
        id: images
        run: |
          grep -oP '^\s+image:\s+\K[^\s@\n]+' docker-compose.yml | sort -u > /tmp/images.txt
          echo "Found $(wc -l < /tmp/images.txt) images"
          cat /tmp/images.txt

      - name: Scan all images and gate on CRITICAL
        run: |
          CRITICAL_TOTAL=0
          HIGH_TOTAL=0
          while IFS= read -r image; do
            [ -z "$image" ] && continue
            echo "::group::Scanning $image"
            RESULT=$(trivy image --scanners vuln --format json --severity CRITICAL,HIGH "$image" 2>/dev/null || echo '{}')
            CRIT=$(echo "$RESULT" | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' 2>/dev/null || echo 0)
            HIGH=$(echo "$RESULT" | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' 2>/dev/null || echo 0)
            CRITICAL_TOTAL=$((CRITICAL_TOTAL + CRIT))
            HIGH_TOTAL=$((HIGH_TOTAL + HIGH))
            echo "  CRITICAL: $CRIT, HIGH: $HIGH (running total: C=$CRITICAL_TOTAL H=$HIGH_TOTAL)"
            echo "::endgroup::"
          done < /tmp/images.txt
          echo "=== TOTAL: CRITICAL=$CRITICAL_TOTAL HIGH=$HIGH_TOTAL ==="
          if [ "$CRITICAL_TOTAL" -gt 0 ]; then
            echo "❌ $CRITICAL_TOTAL CRITICAL CVEs detected across all images"
            exit 1
          else
            echo "✅ No CRITICAL CVEs found"
            exit 0
          fi

  report:
    runs-on: ubuntu-latest
    name: Generate CVE Report
    # Scan intentionally exits 1 when CRITICALs exist (it gates PRs), so this
    # must run on main pushes even when scan fails — otherwise the baseline
    # report is never updated and the job is dead code.
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: scan
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/trivy-action@master

      - name: Run baseline scan
        run: |
          chmod +x ./scripts/trivy-scan.sh
          ./scripts/trivy-scan.sh || true  # Don't fail main branch scan

      # main is protected (require-PR), so a direct git push from the
      # GITHUB_TOKEN is blocked and silently swallowed by `|| echo`. Land the
      # report through a PR instead: force-push a dedicated bot branch and
      # open/update the PR. The PR still needs its required review to merge,
      # which is the intended human gate.
      - name: Commit report to bot branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Trivy Scanner Bot"
          git config user.email "trivy@bot.local"
          git checkout -b chore/trivy-baseline
          git add STAGE-4-CVE-BASELINE.md || true
          if git diff --cached --quiet; then
            echo "Report unchanged - skipping push"
            exit 0
          fi
          git commit -m "docs: update CVE baseline scan report"
          git push -f origin chore/trivy-baseline
          if gh pr view chore/trivy-baseline --json number --jq .number >/dev/null 2>&1; then
            gh pr edit chore/trivy-baseline \
              --title "chore: update CVE baseline scan report" \
              --body "Automated Trivy baseline refresh from the nightly image scan." || true
          else
            gh pr create \
              --base main \
              --head chore/trivy-baseline \
              --title "chore: update CVE baseline scan report" \
              --body "Automated Trivy baseline refresh from the nightly image scan." || true
          fi
