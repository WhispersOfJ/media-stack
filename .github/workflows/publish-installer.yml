name: Publish installer image

# Builds the Dockerfile (bundles docker-compose.yml, scripts/,
# systemd/, and docs into a run-to-extract installer image - see
# entrypoint.sh) and publishes it to GHCR whenever any of those tracked
# files change. Private package by default, matching this repo's visibility.

on:
  push:
    branches: ["main"]
    paths:
      - "docker-compose.yml"
      - ".env.example"
      - "README.md"
      - "CHANGELOG.md"
      - "TODO.md"
      - "scripts/**"
      - "systemd/**"
      - "Dockerfile"
      - "entrypoint.sh"
      - ".dockerignore"
      - ".github/workflows/publish-installer.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: image
        # GHCR requires lowercase - github.repository preserves the actual
        # WhispersOfJ casing, which isn't a valid image path component.
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract version from CHANGELOG
        id: version
        run: |
          v=$(grep -m1 -oP '(?<=Current version: \*\*v)[0-9.]+' CHANGELOG.md)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:v${{ steps.version.outputs.version }}
