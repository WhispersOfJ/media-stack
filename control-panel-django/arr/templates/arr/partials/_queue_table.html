<div class="rule-list" id="queue-table"
     hx-get="/fleet/_queue/"
     hx-trigger="every 15s"
     hx-swap="outerHTML">
  {% for app_name, errors in queue_errors.items %}
  {% for e in errors %}
  <div class="rule-row">
    <div class="rule-main">
      <span class="rule-title">{{ e.title }}</span>
      <span class="rule-desc">{{ app_name }} — {{ e.status }}</span>
      {% for msg in e.messages %}
      <span class="rule-status state-error">{{ msg }}</span>
      {% endfor %}
    </div>
    <button class="btn-ghost"
            hx-post="/fleet/{{ app_name }}/unstick/"
            hx-swap="outerHTML"
            hx-target="#queue-table">
      Unstick
    </button>
  </div>
  {% endfor %}
  {% empty %}
  <div class="hint">No Queue errors.</div>
  {% endfor %}
</div>
