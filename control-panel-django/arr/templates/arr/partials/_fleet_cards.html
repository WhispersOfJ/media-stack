<div class="vitals-row" id="fleet-cards"
     hx-get="/fleet/_cards/"
     hx-trigger="every 15s"
     hx-swap="outerHTML">
  {% for name, app in apps.items %}
  <div class="vital">
    <span class="vital-label">{{ app.label|default:name }}</span>
    <span class="vital-value">{{ app.missing|default:"…" }}</span>
    <span class="vital-sub">
      {% if app.rate_per_hour %}ETA {{ app.eta }}{% else %}missing{% endif %}
      {% if app.error %}<span class="stat-sub-warn">({{ app.error }})</span>{% endif %}
    </span>
  </div>
  {% empty %}
  <div class="hint">No arr apps reachable.</div>
  {% endfor %}
</div>
