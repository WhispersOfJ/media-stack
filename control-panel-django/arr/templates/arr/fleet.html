{% extends "ui/base.html" %}

{% block content %}
<div class="flex flex-col gap-6">

  <!-- Quick Actions -->
  <div class="toolbar">
    <button class="btn btn-primary btn-sm"
            hx-post="/fleet/rss-sync/radarr/"
            hx-swap="none"
            onclick="showToast('info','RSS Sync','Triggered for Radarr')">
      🔄 RSS Sync Radarr
    </button>
    <button class="btn btn-primary btn-sm"
            hx-post="/fleet/rss-sync/sonarr/"
            hx-swap="none"
            onclick="showToast('info','RSS Sync','Triggered for Sonarr')">
      🔄 RSS Sync Sonarr
    </button>
    <button class="btn btn-secondary btn-sm"
            hx-post="/fleet/autofix/"
            hx-swap="none"
            onclick="showToast('info','Auto-fix','Running queue auto-fix')">
      🔧 Auto-fix Queue
    </button>
    <div class="toolbar-separator"></div>
    <button class="btn btn-ghost btn-sm"
            hx-get="/fleet/_queue/"
            hx-target="#queue-table-body"
            hx-swap="innerHTML">
      ↻ Refresh
    </button>
  </div>

  <!-- Fleet Overview Cards -->
  <div id="fleet-cards"
       hx-get="/fleet/_cards/"
       hx-trigger="every 15s"
       hx-swap="outerHTML">
    {% include "arr/partials/_fleet_cards.html" %}
  </div>

  <!-- Tabs -->
  <div class="tabs" role="tablist">
    <button class="tab active" role="tab" onclick="switchTab(this, 'tab-queue')" aria-selected="true">Queue</button>
    <button class="tab" role="tab" onclick="switchTab(this, 'tab-missing')" aria-selected="false">Missing</button>
    <button class="tab" role="tab" onclick="switchTab(this, 'tab-cutoff')" aria-selected="false">Cutoff Unmet</button>
    <button class="tab" role="tab" onclick="switchTab(this, 'tab-blocklist')" aria-selected="false">Blocklist</button>
    <button class="tab" role="tab" onclick="switchTab(this, 'tab-recently')" aria-selected="false">Recently Added</button>
  </div>

  <!-- Queue Tab -->
  <div id="tab-queue" class="tab-panel" role="tabpanel">
    <div class="card" style="padding:0">
      <div style="padding:var(--space-3) var(--space-4); border-bottom:1px solid var(--border-subtle); display:flex; gap:var(--space-3); align-items:center">
        <div class="search" style="flex:1">
          <input type="text" class="input" placeholder="Filter queue..." id="queue-search"
                 oninput="filterQueue(this.value)" aria-label="Filter queue">
        </div>
        <span class="text-xs text-muted" id="queue-count"></span>
      </div>
      <div class="table-wrapper" style="max-height:500px; overflow-y:auto">
        <table class="table" id="queue-table">
          <thead>
            <tr>
              <th class="sortable" onclick="sortTable('queue-table',0)">Title</th>
              <th class="sortable" onclick="sortTable('queue-table',1)">App</th>
              <th>Status</th>
              <th class="sortable" onclick="sortTable('queue-table',3)">Size</th>
              <th class="sortable" onclick="sortTable('queue-table',4)">ETA</th>
              <th style="text-align:right">Action</th>
            </tr>
          </thead>
          <tbody id="queue-table-body"
                 hx-get="/fleet/_queue/"
                 hx-trigger="every 15s"
                 hx-swap="innerHTML">
            {% include "arr/partials/_queue_table.html" %}
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Other tabs (loaded on demand) -->
  <div id="tab-missing" class="tab-panel" role="tabpanel" style="display:none"
       hx-get="/fleet/tab/missing/radarr/" hx-trigger="load" hx-swap="innerHTML">
    <div class="skeleton skeleton-card"></div>
  </div>
  <div id="tab-cutoff" class="tab-panel" role="tabpanel" style="display:none"
       hx-get="/fleet/tab/cutoff/radarr/" hx-trigger="load" hx-swap="innerHTML">
    <div class="skeleton skeleton-card"></div>
  </div>
  <div id="tab-blocklist" class="tab-panel" role="tabpanel" style="display:none"
       hx-get="/fleet/tab/blocklist/radarr/" hx-trigger="load" hx-swap="innerHTML">
    <div class="skeleton skeleton-card"></div>
  </div>
  <div id="tab-recently" class="tab-panel" role="tabpanel" style="display:none"
       hx-get="/fleet/tab/recently/radarr/" hx-trigger="load" hx-swap="innerHTML">
    <div class="skeleton skeleton-card"></div>
  </div>

</div>

<script>
function switchTab(btn, tabId) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });
  document.querySelectorAll('.tab-panel').forEach(function(p) { p.style.display = 'none'; });
  btn.classList.add('active');
  btn.setAttribute('aria-selected', 'true');
  document.getElementById(tabId).style.display = '';
}

function filterQueue(q) {
  var rows = document.querySelectorAll('#queue-table tbody tr');
  q = q.toLowerCase();
  var count = 0;
  rows.forEach(function(r) {
    var text = r.textContent.toLowerCase();
    var show = text.indexOf(q) !== -1;
    r.style.display = show ? '' : 'none';
    if (show) count++;
  });
  document.getElementById('queue-count').textContent = count + ' items';
}
</script>
{% endblock %}
