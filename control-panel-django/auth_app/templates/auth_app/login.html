{% load static %}
<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StackOps — Log in</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">⚡</div>
      <h1 class="login-title">StackOps</h1>
      <p class="login-subtitle">Media stack control panel</p>

      <div class="card">
        {% if error %}
        <div class="login-error" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post" class="login-form" action="{% url 'auth_app:login' %}">
          {% csrf_token %}
          <div class="input-group">
            <label for="username" class="input-label">Username</label>
            <input type="text" id="username" name="username" class="input" required autofocus autocomplete="username">
          </div>
          <div class="input-group">
            <label for="password" class="input-label">Password</label>
            <input type="password" id="password" name="password" class="input" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:var(--space-2)">Log in</button>
        </form>
      </div>
    </div>
  </div>

  <script>
  (function() {
    var saved = localStorage.getItem('stackops-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  })();
  </script>
</body>
</html>
