{% extends "ui/base.html" %}

{% block content %}
<div class="rail">
  <h2>Poster Sync</h2>
  <div class="rule-list">
    {% for lib in libraries %}
    <div class="rule-row">
      <span class="rule-title">{{ lib.title }}</span>
      <span class="rule-desc">{{ lib.type }}</span>
      <button class="btn-ghost"
              hx-get="/posters/_gallery/{{ lib.title|urlencode }}/"
              hx-target="#poster-gallery"
              hx-swap="innerHTML">
        Browse
      </button>
    </div>
    {% empty %}
    <div class="hint">No movie/show libraries found.</div>
    {% endfor %}
  </div>

  <div id="poster-gallery" class="poster-gallery-grid">
    {# Populated by htmx when a library is clicked. #}
  </div>
</div>
{% endblock %}
