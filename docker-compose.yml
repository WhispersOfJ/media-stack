x-common: &common
  restart: unless-stopped
  environment: &common-env
    PUID: ${PUID}
    PGID: ${PGID}
    TZ: ${TZ}
  logging: &common-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

networks:
  stacknet:
    name: stacknet

services:
  # ---------------------------------------------------------------------
  # Indexing
  # ---------------------------------------------------------------------
  prowlarr:
    <<: *common
    # Pinned to hotio's "release" channel tag rather than :latest - verified
    # equivalent to whatever :latest currently resolves to (same digest), so
    # this is a no-op today; going forward, Watchtower still tracks this
    # channel but the choice is explicit rather than an ambiguous "latest".
    image: ghcr.io/hotio/prowlarr:release
    container_name: prowlarr
    networks: [stacknet]
    ports:
      - "9696:9696"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9696/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/prowlarr:/config

  zilean-postgres:
    restart: unless-stopped
    logging: *common-logging
    image: postgres:18-alpine
    container_name: zilean-postgres
    networks: [stacknet]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ZILEAN_POSTGRES_PASSWORD}
      POSTGRES_DB: zilean
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      # postgres 18+ changed the expected mount point up one level (was /var/lib/postgresql/data);
      # PGDATA is now a version-specific subdir it manages itself (/var/lib/postgresql/18/docker).
      - ./config/zilean-postgres:/var/lib/postgresql
    # Postgres's own defaults are hardware-agnostic (128MB shared_buffers etc)
    # regardless of host. Sized for this host's NVMe + shared-desktop memory
    # budget, not maxed out since Plex/desktop apps also run here.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "max_worker_processes=4"
      - "-c"
      - "max_parallel_workers=4"
      - "-c"
      - "max_parallel_workers_per_gather=2"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
    mem_limit: 2g
    mem_reservation: 256m
    cpus: 4

  zilean:
    restart: unless-stopped
    logging: *common-logging
    # Pinned to the exact version currently running (verified same digest as
    # :latest at pin time) rather than :latest.
    image: ipromknight/zilean:v3.5.0
    container_name: zilean
    networks: [stacknet]
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8181/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - zilean-postgres
      - zurg
    environment:
      TZ: ${TZ}
      Zilean__ApiKey: ${ZILEAN_API_KEY}
      Zilean__Database__ConnectionString: "Host=zilean-postgres;Database=zilean;Username=postgres;Password=${ZILEAN_POSTGRES_PASSWORD};Include Error Detail=true;Timeout=30;CommandTimeout=3600;"
      Zilean__Dmm__EnableScraping: "true"
      # Default is 200 - raised so Torznab searches (Prowlarr -> Radarr/
      # Sonarr) surface more cached candidates per query instead of getting
      # cut off, now that Zurg ingestion below adds a second hash source on
      # top of DMM's public hashlist.
      Zilean__Dmm__MaxFilteredResults: "500"
      Zilean__Torrents__EnableEndpoint: "true"
      Zilean__EnableDashboard: "true"
      # Ingests this account's own already-cached Real-Debrid torrents
      # directly from Zurg's /debug/torrents (5,644 entries at time of
      # writing) into Zilean's index - a second hash source alongside DMM's
      # public hashlist, scoped to hashes actually proven cached on this
      # account. Verified live: schema match confirmed against Zilean's own
      # StreamedEntry model (name/hash/size, case-insensitive), and a manual
      # `zilean-scraper generic-sync` run actually ingested them. No
      # equivalent exists for AllDebrid/rclone - Zurg is a purpose-built app
      # with this debug endpoint, rclone's RC API has no matching schema.
      Zilean__Ingestion__EnableScraping: "true"
      Zilean__Ingestion__ZurgInstances__0__Url: "http://zurg:9999"
      Zilean__Ingestion__ZurgInstances__0__EndpointType: "1"
      # Hardware tuning: 16 threads available on this host. Reserve 4 for
      # Plex/desktop/other containers rather than pinning all cores to IMDB
      # title-matching (Zilean's one real CPU-parallel workload).
      Zilean__Imdb__UseAllCores: "false"
      Zilean__Imdb__NumberOfCores: "12"
      # Lucene indexing is "massively faster" per Zilean's own docs, at the
      # cost of ~3GB extra RAM during resyncs - covered by the mem_limit below.
      Zilean__Imdb__UseLucene: "true"
      # .NET Server GC: per-core heaps + parallel collection, the standard
      # throughput-oriented choice for a multi-core backend service
      # (default Workstation GC is tuned for low-latency desktop apps instead).
      DOTNET_gcServer: "1"
      # 3GB hard limit, leaving ~1GB of the 4GB container limit for non-GC
      # (native/thread stack) memory headroom.
      DOTNET_GCHeapHardLimit: "0xC0000000"
    mem_limit: 4g
    mem_reservation: 512m
    cpus: 12

  # ---------------------------------------------------------------------
  # Debrid gateway (Real-Debrid + AllDebrid -> qBittorrent-compatible API
  # for the *arr apps, symlink-only, no real downloading)
  # ---------------------------------------------------------------------
  decypharr:
    <<: *common
    # Pinned to the exact version currently running (verified same digest as
    # :latest at pin time) rather than :latest.
    image: cy01/blackhole:v2.3
    container_name: decypharr
    networks: [stacknet]
    ports:
      - "8282:8282"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8282/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - /mnt:/mnt:rshared
      - ./config/decypharr:/app
      - ./config/decypharr/cache:/cache
    devices:
      - /dev/fuse:/dev/fuse:rwm
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    # Soft ceiling, not a tight fit - observed steady-state is ~540-580MB,
    # the highest baseline of any container besides Zilean/zilean-postgres.
    # No container besides those two had any limit at all before this: one
    # runaway process could otherwise take whatever RAM/CPU it wanted from
    # the same shared-desktop host Zilean's own tuning above already
    # protects for Plex/desktop use.
    mem_limit: 1.5g
    mem_reservation: 256m
    cpus: 4

  # Second, isolated Decypharr instance for AllDebrid only. Decypharr has no
  # per-provider category scoping (a single instance's debrids[] are all
  # available to every category), so the only way to keep AllDebrid
  # exclusive to Sonarr rather than shared with Radarr/Lidarr/Readarr is a
  # fully separate instance - own port, own config/mount, wired into Sonarr
  # only as a download client.
  decypharr-alldebrid:
    <<: *common
    image: cy01/blackhole:v2.3
    container_name: decypharr-alldebrid
    networks: [stacknet]
    ports:
      - "8283:8282"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8282/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - /mnt:/mnt:rshared
      - ./config/decypharr-alldebrid:/app
      - ./config/decypharr-alldebrid/cache:/cache
    devices:
      - /dev/fuse:/dev/fuse:rwm
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    mem_limit: 1.5g
    mem_reservation: 256m
    cpus: 4

  # ---------------------------------------------------------------------
  # Native-companion containerization (Phase 1 of 2 - see CHANGELOG for the
  # full plan). Zurg mounts pre-existing Real-Debrid content directly at
  # /mnt/zurg for Plex; rclone-alldebrid does the same for AllDebrid at
  # /mnt/all. /mnt:rshared on both means the FUSE mount lands at the literal
  # host path Plex's own library already expects - no path remapping needed.
  # Sponsor image (ghcr.io/debridmediamanager/zurg), not the public
  # zurg-testing image.
  # ---------------------------------------------------------------------
  zurg:
    <<: *common
    image: ghcr.io/debridmediamanager/zurg@sha256:924f1737814a72fddc87f90b2cb3056a0d25ecad4e8789d3d5294cf4e1aa0d07
    container_name: zurg
    networks: [stacknet]
    ports:
      - "9999:9999"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9999/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/zurg/config.yml:/app/config.yml
      - ./config/zurg/data:/app/data
      - ./config/zurg/logs:/app/logs
      - /mnt:/mnt:rshared
    devices:
      - /dev/fuse:/dev/fuse:rwm
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    # Observed a sustained ~20-25% CPU baseline (not a spike) across two
    # samples taken 5s apart - likely its own 10s Real-Debrid poll interval
    # plus serving reads for Plex/the arr apps. Capped well above that
    # baseline rather than tightened, purely so it can't compete unbounded
    # with Plex/desktop use if that baseline ever grows.
    mem_limit: 1g
    mem_reservation: 128m
    cpus: 6

  rclone-alldebrid:
    restart: unless-stopped
    logging: *common-logging
    image: rclone/rclone:1.74.3
    container_name: rclone-alldebrid
    networks: [stacknet]
    environment:
      <<: *common-env
      XDG_CONFIG_HOME: /config
    entrypoint: ["rclone"]
    command:
      - "mount"
      - "all:"
      - "/mnt/all"
      - "--config=/config/rclone/rclone.conf"
      - "--dir-cache-time=10s"
      - "--multi-thread-streams=0"
      - "--cutoff-mode=cautious"
      - "--vfs-cache-mode=minimal"
      - "--network-mode"
      - "--buffer-size=0"
      - "--read-only"
      - "--allow-other"
      - "--allow-non-empty"
    healthcheck:
      test: ["CMD-SHELL", "mountpoint -q /mnt/all && [ -n \"$$(ls -A /mnt/all 2>/dev/null)\" ] || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/rclone/rclone.conf:/config/rclone/rclone.conf:ro
      - /mnt:/mnt:rshared
    devices:
      - /dev/fuse:/dev/fuse:rwm
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    # Same reasoning as zurg above (own FUSE mount, no prior ceiling) but
    # lighter - read-only mount, no Real-Debrid polling of its own.
    mem_limit: 512m
    mem_reservation: 64m
    cpus: 4

  # ---------------------------------------------------------------------
  # *arr apps
  # ---------------------------------------------------------------------
  radarr:
    <<: *common
    image: ghcr.io/hotio/radarr:release
    container_name: radarr
    networks: [stacknet]
    ports:
      - "7878:7878"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/radarr:/config
      # Not the blanket /mnt:/mnt bind Sonarr uses - AllDebrid (/mnt/all) is
      # TV-only, so Radarr only gets the two mounts it actually needs.
      - /mnt/zurg:/mnt/zurg:rslave
      - /mnt/decypharr:/mnt/decypharr:rslave
      - ./usenet:/usenet:rslave
      # Same path Decypharr uses internally for its qBittorrent-emulated category
      # folders (/app/downloads/<category>) - identical path avoids needing Remote
      # Path Mappings, per Decypharr's own documented best practice.
      - ./config/decypharr/downloads:/app/downloads:rslave
      # Genuinely writable root folder on regular disk - /mnt/zurg is Zurg's own
      # rclone FUSE mount and does not support having files written into it
      # (confirmed: symlink/hardlink/copy all fail there with I/O errors).
      - ./media/movies:/data/movies

  sonarr:
    <<: *common
    image: ghcr.io/hotio/sonarr:release
    container_name: sonarr
    networks: [stacknet]
    ports:
      - "8989:8989"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/sonarr:/config
      - /mnt:/mnt:rslave
      - ./usenet:/usenet:rslave
      - ./config/decypharr/downloads:/app/downloads:rslave
      - ./media/shows:/data/shows

  lidarr:
    <<: *common
    image: ghcr.io/hotio/lidarr:release
    container_name: lidarr
    networks: [stacknet]
    ports:
      - "8686:8686"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8686/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/lidarr:/config
      - /mnt:/mnt:rslave
      - ./usenet:/usenet:rslave
      - ./config/decypharr/downloads:/app/downloads:rslave
      - ./media/music:/data/music

  readarr:
    <<: *common
    image: lscr.io/linuxserver/readarr:0.4.19-nightly
    container_name: readarr
    networks: [stacknet]
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8787/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/readarr:/config
      - /mnt:/mnt:rslave
      - ./usenet:/usenet:rslave
      - ./config/decypharr/downloads:/app/downloads:rslave
      - ./media/books:/data/books

  # ---------------------------------------------------------------------
  # Usenet (real local downloads - only path that isn't debrid/symlink based)
  # ---------------------------------------------------------------------
  nzbget:
    <<: *common
    image: ghcr.io/hotio/nzbget:release
    container_name: nzbget
    networks: [stacknet]
    ports:
      - "6789:6789"
    # NZBGet's web UI requires its own auth, so a plain request 401s - that's
    # still proof the server is alive and responding, so 401 counts as healthy.
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:6789/); echo \"$$code\" | grep -qE '^(2|3|401)' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/nzbget:/config
      - ./usenet:/usenet

  # ---------------------------------------------------------------------
  # Requests
  # ---------------------------------------------------------------------
  seerr:
    restart: unless-stopped
    logging: *common-logging
    # Digest-pinned rather than a version tag: upstream's last tagged
    # release (v3.0.1) is behind what's actually shipped as :latest (running
    # version reports 3.3.0 via its own API) - no matching tag exists to pin
    # to without downgrading, so this freezes exactly what's running today.
    # Bump this digest deliberately when upstream cuts a new tagged release.
    image: ghcr.io/seerr-team/seerr@sha256:c92d2dc117f62185e7bcb88cd56efd374ea79210eaf433275449e8d5988eb5a8
    container_name: seerr
    networks: [stacknet]
    ports:
      - "5055:5055"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5055/api/v1/status >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      TZ: ${TZ}
    volumes:
      - ./config/seerr:/app/config

  # ---------------------------------------------------------------------
  # Media server. Containerized from a native install in 3.3.0; the native
  # plexmediaserver package, its systemd unit, and /var/lib/plex were fully
  # removed in 4.8.0 - this container is the only Plex on the host now, no
  # rollback fallback kept. See CHANGELOG for both.
  # ---------------------------------------------------------------------
  plex:
    restart: unless-stopped
    logging: *common-logging
    # Official image, not a LinuxServer-style fork - a PUID/PGID-forcing
    # image would recursively chown the ~33GB library to PUID/PGID on first
    # boot (same reason the Kometa entry below avoids the LinuxServer fork).
    # The native install ran the Plex Pass (beta) channel at 1.43.3.10793;
    # the official image only publishes the public channel, whose newest
    # tag (1.43.2.10687) is slightly behind that. Deliberate, not an
    # oversight - public channel on the official image is the more
    # conservative choice for a containerized production library anyway.
    # Bump this tag deliberately, not via Watchtower (see below).
    image: plexinc/pms-docker:1.43.2.10687-563d026ea
    container_name: plex
    # Plex's own guidance for Docker: GDM auto-discovery, DLNA, and
    # remote-access NAT-PMP/UPnP negotiation are all unreliable on bridge
    # networking. Every other service in this stack already publishes
    # directly to 0.0.0.0 with no reverse proxy, so this is a deliberate,
    # documented exception to the stacknet/published-port pattern rather
    # than an inconsistency - no networks:/ports: block, both are invalid
    # alongside network_mode: host.
    network_mode: host
    environment:
      TZ: ${TZ}
      # Matches the uid/gid the native install used to own the library as,
      # so the migrated ~33GB library needed zero chown. The native install
      # is gone now (4.8.0), but this uid/gid still owns config/plex on
      # disk, so it stays.
      PLEX_UID: "955"
      PLEX_GID: "955"
      # Native Arch install set this to a flat directory (no
      # Library/Application Support nesting); set it the same way here so
      # config/plex/Plex Media Server could be copied over verbatim from
      # /var/lib/plex without restructuring it.
      PLEX_MEDIA_SERVER_APPLICATION_SUPPORT_DIR: /config
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:32400/identity || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ./config/plex:/config
      - ./config/plex-transcode:/transcode
      # Both existing library sections (Movies at /mnt/zurg/movies; TV
      # Shows at /mnt/zurg/shows and /mnt/all/magnets - confirmed via the
      # migrated library DB's own section_locations table) resolve under
      # /mnt, so this one mount is exact path parity with what's already in
      # the database - no relinking, no "fix missing files".
      - /mnt:/mnt:rslave
      # Not yet an actual library location in Plex today (verified against
      # the DB), but every arr app's writable root folder lives here and
      # the README has long recommended adding it - mounted now so it's
      # available the moment that's done, at the same absolute path the
      # arr apps themselves use it at.
      - ./media:/home/bear/Stack/media
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    # video/render host GIDs - renderD128 is already world-writable
    # (confirmed: crw-rw-rw-), so this is a defensive fallback rather than
    # strictly required for VAAPI hardware transcoding to work.
    group_add:
      - "983"
      - "987"
    # Caught live during tuning: a library scan alone briefly pushed this to
    # 100% CPU with zero active playback sessions (confirmed via /activities
    # - "Scanning TV Shows", not a transcode). HW transcoding covers
    # play/decode, not scan/analysis/thumbnail passes, so this can spike on
    # its own. 12 of 16 threads leaves the same 4-thread desktop headroom
    # Zilean's own tuning above already reserves.
    mem_limit: 6g
    mem_reservation: 512m
    cpus: 12

  # =======================================================================
  # Optional / recommended extras - start with:
  #   docker compose --profile extras up -d
  # =======================================================================
  bazarr:
    <<: *common
    image: ghcr.io/hotio/bazarr:release
    container_name: bazarr
    profiles: [extras]
    networks: [stacknet]
    ports:
      - "6767:6767"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6767/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/bazarr:/config
      - /mnt:/mnt:rslave
      # Identical paths to Radarr/Sonarr's own root folders - avoids needing
      # Bazarr's Path Mappings feature, same reasoning as the *arr apps'
      # shared /app/downloads path above.
      - ./media/movies:/data/movies
      - ./media/shows:/data/shows
    # 141 PIDs observed at rest - far more threads/processes than any other
    # container here, likely per-provider subtitle-search workers. Not
    # obviously a leak (RAM stayed modest, ~230MB), but cheap insurance
    # given nothing was capping it before.
    mem_limit: 1g
    mem_reservation: 128m
    cpus: 2

  # Replaced FlareSolverr in 3.4.0 - same role (Cloudflare challenge solver,
  # registered as Prowlarr's Indexer Proxy), same port, same FlareSolverr-
  # compatible /v1 API (Prowlarr's proxy type is still literally named
  # "FlareSolverr" - only the host URL changed). Uses Camoufox (a
  # Firefox-based anti-detect browser) instead of Selenium +
  # undetected-chromedriver, with a faster patch cadence against Cloudflare's
  # evolving detection signals. See CHANGELOG for the swap and live
  # verification.
  byparr:
    restart: unless-stopped
    logging: *common-logging
    # Digest-pinned rather than a version tag - the project doesn't publish
    # clean vX.Y.Z tags on its GHCR registry the way its GitHub releases
    # suggest (only :latest, :main, and commit-sha/arch-specific tags were
    # actually resolvable at pin time). Same "manually bumped, not on
    # Watchtower's train" reasoning as Plex above either way: this is a
    # security/anti-bot component other indexers depend on, an unattended
    # breaking update is worth avoiding.
    image: ghcr.io/thephaseless/byparr@sha256:01a46a2865d9a6db5eb8ead04ec0dd33b8fbe233e8565ae70b50d4cc0af4cfb0
    container_name: byparr
    profiles: [extras]
    networks: [stacknet]
    ports:
      - "8191:8191"
    # Byparr's own docs: without this, some environments hit a
    # multiprocessing.synchronize error on startup.
    shm_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8191/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      TZ: ${TZ}
    # Defensive, not observed - idle footprint is modest (~130MB) but each
    # Cloudflare solve spins up a real Camoufox (Firefox-based) browser
    # instance, and concurrent solves under real load haven't been tested
    # yet.
    mem_limit: 2g
    mem_reservation: 256m
    cpus: 4

  tautulli:
    <<: *common
    image: ghcr.io/hotio/tautulli:release
    container_name: tautulli
    profiles: [extras]
    networks: [stacknet]
    # Container's own web UI listens internally on Tautulli's default 8181;
    # public port stays 8182.
    ports:
      - "8182:8181"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8181/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/tautulli:/config
    # No prior ceiling - same defensive reasoning as Bazarr above (simple
    # companion app, modest observed footprint, cheap insurance).
    mem_limit: 512m
    mem_reservation: 64m
    cpus: 2

  # Single dashboard for this stack: live container status/control, host
  # stats, Zilean hash count, one-click ops actions, and a Quick Links panel
  # to every service's own web UI. That last part is what let Heimdall and
  # Homepage (both simple link launchers/widget dashboards, never this
  # stack's ops tool) be removed entirely rather than kept alongside it -
  # see README.md's Dashboard section. Custom build (control-panel/), not a
  # pulled image.
  control-panel:
    build: ./control-panel
    restart: unless-stopped
    logging: *common-logging
    container_name: control-panel
    profiles: [extras]
    networks: [stacknet]
    ports:
      - "8420:8420"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8420/healthz')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    environment:
      PLEX_URL: ${PLEX_URL}
      PLEX_TOKEN: ${PLEX_TOKEN}
      RADARR_API_KEY: ${RADARR_API_KEY}
      SONARR_API_KEY: ${SONARR_API_KEY}
      LIDARR_API_KEY: ${LIDARR_API_KEY}
      READARR_API_KEY: ${READARR_API_KEY}
      # Read-only stat tile only (SELECT COUNT(*) FROM "Torrents") - reuses
      # the same credential Zilean itself already has, no new secret.
      ZILEAN_POSTGRES_PASSWORD: ${ZILEAN_POSTGRES_PASSWORD}
    volumes:
      # Read-write, unlike Homepage's docker.sock mount above - this one
      # actually execs into containers (Kometa's on-demand run) and issues
      # restarts, not just reads status. Runs as root in-container (no
      # PUID/PGID) since root is what the socket needs; no other privilege
      # escalation beyond that. LAN-only, no auth in front - same threat
      # model as every other service in this stack (see README's Security
      # note), acknowledged as a deliberately higher-blast-radius exception.
      - /var/run/docker.sock:/var/run/docker.sock
    # No prior ceiling despite having docker.sock exec/restart access - a
    # light Flask app, but cheap insurance given its elevated blast radius.
    mem_limit: 512m
    mem_reservation: 64m
    cpus: 2

  # Real host-level CPU/memory/disk/uptime, proxied into Control Panel's
  # overview strip (a container's own /proc only reports its own usage -
  # this is what actually sees the host). pid: host + the read-only rootfs
  # mount are both required for it to see the host rather than itself.
  # Also has its own web UI, so it's linked directly in Quick Links too.
  glances:
    restart: unless-stopped
    logging: *common-logging
    # Digest-pinned: upstream's newest tagged release (4.5.5) doesn't match
    # what's actually shipped as :latest - no matching tag exists to pin to
    # without downgrading, so this freezes exactly what's running today.
    # Bump this digest deliberately when ready to take a newer release.
    image: nicolargo/glances@sha256:5bc5b6cf2e7b992910cfd9e19799a540d8460e9356bc506c2f1af58f3bd9cb0e
    container_name: glances
    profiles: [extras]
    networks: [stacknet]
    pid: host
    ports:
      - "61208:61208"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:61208/api/4/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      TZ: ${TZ}
      GLANCES_OPT: "-w"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
    # No prior ceiling - lightweight monitoring agent, cheap insurance.
    mem_limit: 512m
    mem_reservation: 64m
    cpus: 2

  # Automated Plex collections/metadata/overlays. Official image only - the
  # LinuxServer fork resets /config ownership to PUID/PGID (or 911:911 if
  # unset) on every start, which the official image doesn't do and most of
  # the wiki's examples assume you're not using anyway. The stable channel is
  # still :latest (not :nightly/:develop) - now digest-pinned since upstream's
  # newest tagged release (v2.4.4) doesn't match what :latest actually ships,
  # so a tag pin would silently jump forward instead of freezing what's
  # running. Bump this digest deliberately when ready to take a newer build.
  # No web UI of its own - runs as a scheduled batch job against Plex's API,
  # so no port is published; see Homepage/Heimdall entries for how it's
  # surfaced there instead.
  kometa:
    restart: unless-stopped
    logging: *common-logging
    image: kometateam/kometa@sha256:98a0df2694edea467ac8870bcecddea3ec0bc14a071721372fb9fa811a829902
    container_name: kometa
    profiles: [extras]
    networks: [stacknet]
    # No web UI/API - checks that the main kometa.py process is still alive
    # via /proc rather than an HTTP probe.
    healthcheck:
      test: ["CMD-SHELL", "grep -aq kometa.py /proc/[1-9]*/cmdline 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      TZ: ${TZ}
    volumes:
      - ./config/kometa:/config
    # 642MB observed resident even while "sleeping" between scheduled runs -
    # the largest idle footprint of any container besides Postgres/Zilean,
    # mostly inherent to its dependency stack (image processing, several
    # metadata-agent SDKs) rather than misconfiguration. Real overlay/poster
    # generation runs can spike further, hence the ceiling rather than just
    # accepting the idle number as the max.
    mem_limit: 2g
    mem_reservation: 256m
    cpus: 4

  unpackerr:
    restart: unless-stopped
    logging: *common-logging
    # Digest-pinned: upstream's newest tagged release (0.15.2) doesn't match
    # what's actually shipped as :latest - no matching tag exists to pin to
    # without downgrading, so this freezes exactly what's running today.
    # Bump this digest deliberately when ready to take a newer release.
    image: golift/unpackerr@sha256:4ec141eeb0cb2f971d7c92f21cc40b0d2d50d7920eb7a0557443cca52270c0b0
    container_name: unpackerr
    profiles: [extras]
    networks: [stacknet]
    # No web UI/API - checks that the main unpackerr process is still alive
    # via /proc rather than an HTTP probe.
    healthcheck:
      test: ["CMD-SHELL", "grep -aq unpackerr /proc/[1-9]*/cmdline 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      TZ: ${TZ}
      UN_RADARR_0_URL: http://radarr:7878
      UN_SONARR_0_URL: http://sonarr:8989
      UN_LIDARR_0_URL: http://lidarr:8686
    volumes:
      - /mnt:/mnt:rslave
      - ./usenet:/usenet:rslave
    # No prior ceiling - extraction (unzip/unrar) can spike CPU briefly on
    # large archives, cheap insurance same as the other companion apps above.
    mem_limit: 512m
    mem_reservation: 64m
    cpus: 2

  watchtower:
    restart: unless-stopped
    logging: *common-logging
    image: nickfedor/watchtower:1.19.0
    container_name: watchtower
    profiles: [extras]
    networks: [stacknet]
    # No shell in this image (distroless-style) - uses Watchtower's own
    # built-in --health-check flag rather than a wget/curl probe.
    healthcheck:
      test: ["CMD", "/watchtower", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    environment:
      TZ: ${TZ}
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
      # Every actual update (or update failure) now posts to Discord instead
      # of happening silently overnight.
      WATCHTOWER_NOTIFICATIONS: "shoutrrr"
      WATCHTOWER_NOTIFICATION_URL: ${DISCORD_WATCHTOWER_SHOUTRRR_URL}
      WATCHTOWER_NOTIFICATIONS_HOSTNAME: ${HOST_IP}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # No prior ceiling - idle daemon most of the time, cheap insurance
    # despite the docker.sock access it needs to do its job.
    mem_limit: 256m
    mem_reservation: 32m
    cpus: 1
