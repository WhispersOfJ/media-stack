x-common: &common
  restart: unless-stopped
  environment: &common-env
    PUID: ${PUID}
    PGID: ${PGID}
    TZ: ${TZ}
  logging: &common-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

networks:
  stacknet:
    name: stacknet

services:
  # ---------------------------------------------------------------------
  # Indexing
  # ---------------------------------------------------------------------
  prowlarr:
    <<: *common
    # Pinned to hotio's "release" channel tag rather than :latest - verified
    # equivalent to whatever :latest currently resolves to (same digest), so
    # this is a no-op today; going forward, Watchtower still tracks this
    # channel but the choice is explicit rather than an ambiguous "latest".
    image: ghcr.io/hotio/prowlarr:release
    container_name: prowlarr
    networks: [stacknet]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9696/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "9696:9696"
    # No prior limit at all - found live via a resource audit (docker stats
    # showing the full host ceiling instead of a real number). Sized from
    # observed baseline (~195MB) with real headroom.
    mem_limit: 1g
    mem_reservation: 128m
    cpus: 2

  # ---------------------------------------------------------------------
  # *arr apps
  # ---------------------------------------------------------------------
  radarr:
    <<: *common
    image: ghcr.io/hotio/radarr:release
    container_name: radarr
    networks: [stacknet]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/radarr:/config
      - /mnt/nzbdav:/mnt/nzbdav:rslave
      # Genuinely writable root folder on regular disk - the old debrid FUSE
      # mounts did not support having files written into them (confirmed:
      # symlink/hardlink/copy all failed there with I/O errors).
      - ./media/movies:/data/movies
    ports:
      - "7878:7878"
    # No prior limit at all - found live via a resource audit. Sized above
    # observed baseline (~390MB) with real headroom for a 15,000+ title
    # library doing an active scan/import.
    mem_limit: 2g
    mem_reservation: 256m
    cpus: 2

  sonarr:
    <<: *common
    image: ghcr.io/hotio/sonarr:release
    container_name: sonarr
    networks: [stacknet]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/sonarr:/config
      - /mnt/nzbdav:/mnt/nzbdav:rslave
      - ./media/shows:/data/shows
    ports:
      - "8989:8989"
    # No prior limit at all - found live via a resource audit. Sized above
    # observed baseline (~477MB) with real headroom - this instance tracks
    # close to 300,000 episode records (see Known gaps' missing-aired note).
    mem_limit: 2g
    mem_reservation: 256m
    cpus: 2


  # ---------------------------------------------------------------------
  # Usenet - streaming, no local disk (NzbDAV: WebDAV filesystem + rclone
  # mount, the same "virtual filesystem" pattern this stack's now-removed
  # debrid layer - Zurg/rclone-alldebrid - used to use). Replaces NZBGet
  # (real local downloads) as of CHANGELOG
  # [10.1.0] - that approach never actually streamed, it wrote real files
  # to disk, which wasn't the goal.
  # ---------------------------------------------------------------------
  nzbdav:
    restart: unless-stopped
    logging: *common-logging
    image: nzbdav/nzbdav:latest
    container_name: nzbdav
    networks: [stacknet]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./config/nzbdav:/config
      - /mnt:/mnt
      # Repairs feature needs to see the *arr apps' own root folders to scan
      # for symlinks/*.strm and correlate them back to Radarr/Sonarr entries -
      # same /data/movies, /data/shows paths those apps report as their own
      # root folders (see radarr/sonarr services above), so nzbdav's repair
      # engine's path lookups line up with no remapping needed. Only
      # Radarr+Sonarr are wired into the Repairs tab today, so only their root
      # folders are mounted. Read-only - nzbdav repairs via the Radarr/Sonarr
      # API (delete+research), not by touching the symlinks directly.
      - ./media/movies:/data/movies:ro
      - ./media/shows:/data/shows:ro
    # Host port 3001, not 3000 - DebridMediaManager used to own 3000 on this
    # host (removed v10.20.0); left at 3001 rather than reclaiming 3000, to
    # avoid moving a stable port out from under anything bookmarked to it.
    # Internally still :3000 (Radarr/Sonarr/rclone all reach it as
    # http://nzbdav:3000 over stacknet, unaffected by the host mapping).
    ports:
      - "3001:3000"
    # No prior limit at all - found live via a resource audit. Sized above
    # observed baseline (~369MB) - WebDAV streaming has real per-connection
    # buffering cost. Bumped 1g->2g after a live repair/import batch sat at
    # 62% of the 1g cap mid-run with connection count raised to 20.
    mem_limit: 2g
    mem_reservation: 128m
    cpus: 2

  nzbdav-rclone:
    restart: unless-stopped
    logging: *common-logging
    image: rclone/rclone:1.74.4
    container_name: nzbdav-rclone
    networks: [stacknet]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ./config/nzbdav-rclone/rclone.conf:/config/rclone/rclone.conf:ro
      - /mnt:/mnt:rshared
    devices:
      - /dev/fuse:/dev/fuse:rwm
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    depends_on:
      nzbdav:
        condition: service_healthy
    # Setup guide's streaming-tuned cache flags (buffer-size=0 avoids
    # double-caching since the OS/Plex already buffer reads; read-ahead
    # sized for smooth playback of high-bitrate remuxes).
    command:
      - "mount"
      - "nzbdav:"
      - "/mnt/nzbdav"
      - "--config=/config/rclone/rclone.conf"
      - "--uid=1000"
      - "--gid=1000"
      - "--allow-other"
      - "--allow-non-empty"
      - "--links"
      - "--use-cookies"
      - "--vfs-cache-mode=full"
      - "--vfs-cache-max-size=20G"
      - "--vfs-cache-max-age=24h"
      - "--buffer-size=0M"
      - "--vfs-read-ahead=512M"
      - "--dir-cache-time=20s"
    healthcheck:
      test: ["CMD-SHELL", "mountpoint -q /mnt/nzbdav || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    mem_reservation: 64m
    cpus: 4

  # ---------------------------------------------------------------------
  # Requests
  # ---------------------------------------------------------------------
  seerr:
    restart: unless-stopped
    logging: *common-logging
    # Digest-pinned rather than a version tag: upstream's last tagged
    # release (v3.0.1) is behind what's actually shipped as :latest (running
    # version reports 3.3.0 via its own API) - no matching tag exists to pin
    # to without downgrading, so this freezes exactly what's running today.
    # Bump this digest deliberately when upstream cuts a new tagged release.
    image: ghcr.io/seerr-team/seerr@sha256:c92d2dc117f62185e7bcb88cd56efd374ea79210eaf433275449e8d5988eb5a8
    container_name: seerr
    networks: [stacknet]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5055/api/v1/status >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      TZ: ${TZ}
    volumes:
      - ./config/seerr:/app/config
    ports:
      - "5055:5055"
    # No prior limit at all - found live via a resource audit. Sized above
    # observed baseline (~72MB).
    mem_limit: 1g
    mem_reservation: 128m
    cpus: 2

  # ---------------------------------------------------------------------
  # Media server (Jellyfin) - replaced Plex entirely (removed in full: see
  # CLAUDE.md's History for the migration and CHANGELOG). LinuxServer image
  # chosen for consistency with this stack's existing PUID/PGID convention
  # (every hotio-style service uses the same pattern) - not a claim the
  # official jellyfin/jellyfin image is worse, just a deliberate match to
  # how every other service here is run.
  # Back on stacknet (bridge), not network_mode: host - a brief attempt at
  # host networking for UDP client-discovery (port 7359, used by mobile
  # apps' Bonjour-style LAN scan) was tried and deliberately reverted at the
  # user's request. Client-discovery does not work on bridge networking as
  # a result (same limitation Plex's network_mode: host used to solve) -
  # accepted tradeoff, not an oversight.
  # ---------------------------------------------------------------------
  jellyfin:
    <<: *common
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    networks: [stacknet]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ./config/jellyfin:/config
      - ./media/movies:/data/movies
      - ./media/shows:/data/shows
      # Every file under both root folders is a symlink into NzbDAV's own
      # WebDAV filesystem (e.g. /mnt/nzbdav/.ids/...), never a real file -
      # this mount was missing for a while after Jellyfin's initial deploy,
      # exactly reproducing the Stash bug this stack's CLAUDE.md already
      # documents: every symlink resolved to a path that didn't exist inside
      # this container's own mount namespace, so Jellyfin silently added
      # zero episodes (series/season folders are real directories and
      # matched fine; the episode files themselves are what's symlinked).
      - /mnt/nzbdav:/mnt/nzbdav:rslave
    # Same iGPU render node and GIDs Plex used to hold - VAAPI render nodes
    # support concurrent processes, this is just the sole remaining consumer
    # now.
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - "983"
      - "987"
    ports:
      - "8096:8096"
    # Starting at parity with Plex's own ceiling - tune down once real
    # usage is observed via docker stats, same practice as every other
    # service in this file.
    mem_limit: 3g
    mem_reservation: 512m
    cpus: 6

  # =======================================================================
  # Optional / recommended extras - start with:
  #   docker compose --profile extras up -d
  # =======================================================================
  tautulli:
    <<: *common
    image: ghcr.io/hotio/tautulli:release
    container_name: tautulli
    profiles: [extras]
    networks: [stacknet]
    # Container's own web UI listens internally on Tautulli's default 8181;
    # public port stays 8182.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8181/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/tautulli:/config
    # No prior ceiling - simple companion app, modest observed footprint,
    # cheap insurance.
    ports:
      - "8182:8181"
    mem_limit: 512m
    mem_reservation: 64m
    cpus: 2

  # ---------------------------------------------------------------------
  # Jellystat: Jellyfin watch-history/stats dashboard, the Tautulli
  # equivalent for Jellyfin (Tautulli itself is Plex-only, no Jellyfin
  # support exists). Needs its own Postgres - this stack's last Postgres
  # dependency (zilean-postgres) was removed entirely in v11.0.0; this
  # reintroduces one deliberately. Add ./config/jellystat-db to the backup
  # story explicitly (a logical dump step, not raw-file backup of a live
  # datadir) rather than assuming restic's existing exclusions cover it -
  # this stack has already been burned once by a DB-backed service getting
  # zero backup coverage by default.
  # ---------------------------------------------------------------------
  jellystat-db:
    restart: unless-stopped
    logging: *common-logging
    image: postgres:18.1
    container_name: jellystat-db
    profiles: [extras]
    networks: [stacknet]
    environment:
      POSTGRES_USER: ${JELLYSTAT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${JELLYSTAT_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JELLYSTAT_POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      # postgres:18+ manages its own version-specific subdirectory under a
      # single /var/lib/postgresql mount, not the old .../data convention -
      # confirmed live: the old mount path crash-looped the container with
      # "PostgreSQL data in an old, unsupported location" on first boot.
      - ./config/jellystat-db:/var/lib/postgresql
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1

  jellystat:
    restart: unless-stopped
    logging: *common-logging
    image: cyfershepard/jellystat:latest
    container_name: jellystat
    profiles: [extras]
    networks: [stacknet]
    depends_on:
      jellystat-db:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      POSTGRES_USER: ${JELLYSTAT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${JELLYSTAT_POSTGRES_PASSWORD}
      POSTGRES_IP: jellystat-db
      POSTGRES_PORT: "5432"
      JWT_SECRET: ${JELLYSTAT_JWT_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/jellystat-backup:/app/backend/backup-data
    # Host port 8087, not upstream's default 3000 - this stack's own
    # history already has a documented "who owns port 3000" thread
    # (DebridMediaManager, then deliberately left free when NzbDAV moved to
    # 3001); picking a clean unused port here rather than reviving that.
    ports:
      - "8087:3000"
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1

  # Subtitle management for Radarr/Sonarr - connected via API key post-boot
  # (Bazarr has no env-var wiring for this, same pattern as Maintainerr
  # below), watches both libraries for missing English subs and downloads
  # from whichever configured providers have them. Removed entirely in
  # v10.2.0 (see README History); this is a from-scratch reinstall, not a
  # restore - no config/bazarr state survived the removal.
  bazarr:
    <<: *common
    image: ghcr.io/hotio/bazarr:release
    container_name: bazarr
    profiles: [extras]
    networks: [stacknet]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6767/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/bazarr:/config
      - ./media/movies:/data/movies
      - ./media/shows:/data/shows
    ports:
      - "6767:6767"
    # No prior baseline to size against (fresh reinstall) - matching
    # Tautulli's ceiling as the nearest comparable companion-app footprint.
    mem_limit: 512m
    mem_reservation: 64m
    cpus: 2

  # Single dashboard for this stack: live container status/control, host
  # stats, Zilean hash count, one-click ops actions, and a Quick Links panel
  # to every service's own web UI. That last part is what let Heimdall and
  # Homepage (both simple link launchers/widget dashboards, never this
  # stack's ops tool) be removed entirely rather than kept alongside it -
  # see README.md's Dashboard section. Custom build (control-panel/), not a
  # pulled image.
  control-panel:
    build: ./control-panel
    restart: unless-stopped
    logging: *common-logging
    container_name: control-panel
    profiles: [extras]
    networks: [stacknet]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8420/healthz')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    environment:
      # Plex removed entirely (full migration to Jellyfin) - these replace
      # the old PLEX_URL/PLEX_TOKEN pair. app.py's actual Plex-route rework
      # (14 routes, see CLAUDE.md's migration plan) is still pending as its
      # own follow-up; until then every /api/plex/* route 503s the same way
      # it always has when its required env vars are unset - by design, not
      # a new failure mode.
      JELLYFIN_URL: ${JELLYFIN_URL}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY}
      RADARR_API_KEY: ${RADARR_API_KEY}
      SONARR_API_KEY: ${SONARR_API_KEY}
      NZBDAV_API_KEY: ${NZBDAV_API_KEY}
      # NzbDAV's SABnzbd-compatible api.key (above) is only accepted by its
      # Sab*Controller endpoints (queue/history). Its own settings API
      # (/api/get-config, /api/update-config) is a separate ASP.NET backend
      # that only accepts requests carrying a valid __session cookie from
      # POST /login - there's no static API key for it, so a login step
      # is required before every call.
      NZBDAV_ADMIN_USER: ${NZBDAV_ADMIN_USER}
      NZBDAV_ADMIN_PASSWORD: ${NZBDAV_ADMIN_PASSWORD}
      # Prowlarr has no other integration in this stack (CONTAINER_LABELS
      # dashboard entry only) - added specifically so /api/log-levels can
      # cover all five Servarr-shaped apps, not just the four QUEUE_ARR_APPS.
      PROWLARR_API_KEY: ${PROWLARR_API_KEY}
      # notify_test() only - reuses the same webhook every backup/health
      # alert script already posts to, no new secret.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      # Origin/Host validation only (see app.py's verify_same_origin) - not
      # auth, just closing the cross-origin-POST hole given this panel's
      # docker.sock access.
      HOST_IP: ${HOST_IP}
      # Poster sync only (/api/posters/sync) - this app's own TMDb key.
      TMDB_KEY: ${TMDB_KEY}
      # /api/ratings/imdb, /api/ratings/mdblist - used to be read live off
      # Kometa's own config.yml; standalone secrets now that Kometa was
      # removed entirely (no Jellyfin support - see CLAUDE.md's migration
      # History).
      OMDB_KEY: ${OMDB_KEY}
      MDBLIST_KEY: ${MDBLIST_KEY}
    volumes:
      # Read-write, unlike Homepage's docker.sock mount above - this one
      # actually execs into containers (Kometa's on-demand run) and issues
      # restarts, not just reads status. Runs as root in-container (no
      # PUID/PGID) since root is what the socket needs; no other privilege
      # escalation beyond that. No auth - LAN-only, matches every other
      # service in this stack (see README.md's Security section); the
      # elevated blast radius here (exec/restart the whole stack from one
      # unauthenticated endpoint) is mitigated by the Origin/Host check
      # below, not by a login gate.
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only additions for the stack-* diagnostic endpoints
      # (resource-check/mount-health/perms-check/backup-verify/etc.) - none
      # of these need write access, only visibility into what's already there.
      - /mnt:/mnt:ro
      - ./config:/host-config:ro
      - /home/bear/backups:/host-backups:ro
      - /home/bear/Dropbox/stack-restic-repo-offsite:/host-backup-offsite:ro
      # Single-file bind mount, not a directory - confirmed live this
      # session as a real gotcha: Docker binds a specific inode for a
      # single-file mount, not the directory entry, so an editor that
      # replaces the file (write-new-inode-then-rename, which most
      # editors/tools do for atomic writes) leaves the mount pointing at
      # the old, now-unlinked inode. /api/version reported a stale
      # declared version through several README edits until this
      # container was explicitly recreated (`--force-recreate`, not just
      # `up -d` - a plain `up -d` doesn't recreate a container whose own
      # config hasn't changed). If /api/version ever looks stale again,
      # recreate this container before assuming the endpoint logic broke.
      - ./README.md:/host-README.md:ro
    # No prior ceiling despite having docker.sock exec/restart access - a
    # light Flask app, but cheap insurance given its elevated blast radius.
    ports:
      - "8420:8420"
    mem_limit: 512m
    mem_reservation: 64m
    cpus: 2

  unpackerr:
    restart: unless-stopped
    logging: *common-logging
    # Digest-pinned: upstream's newest tagged release (0.15.2) doesn't match
    # what's actually shipped as :latest - no matching tag exists to pin to
    # without downgrading, so this freezes exactly what's running today.
    # Bump this digest deliberately when ready to take a newer release.
    image: golift/unpackerr@sha256:4ec141eeb0cb2f971d7c92f21cc40b0d2d50d7920eb7a0557443cca52270c0b0
    container_name: unpackerr
    profiles: [extras]
    networks: [stacknet]
    # No web UI/API - checks that the main unpackerr process is still alive
    # via /proc rather than an HTTP probe.
    healthcheck:
      test: ["CMD-SHELL", "grep -aq unpackerr /proc/[1-9]*/cmdline 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      TZ: ${TZ}
      # Was missing every API key below (not just blank - entirely absent), so Unpackerr ran
      # with "0 servers" configured since the day it was added. Confirmed live via its own
      # startup log: "No Starr apps or folders configured."
      UN_RADARR_0_URL: http://radarr:7878
      UN_RADARR_0_API_KEY: ${RADARR_API_KEY}
      UN_SONARR_0_URL: http://sonarr:8989
      UN_SONARR_0_API_KEY: ${SONARR_API_KEY}
      # No UN_READARR entry - Bindery replaced Readarr in v10.7.0 and isn't
      # a supported Unpackerr "Starr app" (too new for that fixed list).
      # Low-impact: ebook releases are rarely RAR'd the way video/audio
      # ones are.
    volumes:
      - /mnt/nzbdav:/mnt/nzbdav:rslave
      - ./usenet:/usenet:rslave
    # No prior ceiling - extraction (unzip/unrar) can spike CPU briefly on
    # large archives, cheap insurance same as the other companion apps above.
    mem_limit: 512m
    mem_reservation: 64m
    cpus: 2

  watchtower:
    restart: unless-stopped
    logging: *common-logging
    image: nickfedor/watchtower:1.19.0
    container_name: watchtower
    profiles: [extras]
    networks: [stacknet]
    # No shell in this image (distroless-style) - uses Watchtower's own
    # built-in --health-check flag rather than a wget/curl probe.
    healthcheck:
      test: ["CMD", "/watchtower", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    environment:
      TZ: ${TZ}
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
      # Every actual update (or update failure) now posts to Discord instead
      # of happening silently overnight.
      WATCHTOWER_NOTIFICATIONS: "shoutrrr"
      WATCHTOWER_NOTIFICATION_URL: ${DISCORD_WATCHTOWER_SHOUTRRR_URL}
      WATCHTOWER_NOTIFICATIONS_HOSTNAME: ${HOST_IP}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # No prior ceiling - idle daemon most of the time, cheap insurance
    # despite the docker.sock access it needs to do its job.
    mem_limit: 256m
    mem_reservation: 32m
    cpus: 1

  # ---------------------------------------------------------------------
  # Queue cleanup/missing-content automation. Automates what Control
  # Panel's own "unstick" and "search missing" buttons already do by hand -
  # roles deliberately split between the two apps below: Cleanuparr owns
  # strikes/malware-blocking/stalled-cleanup, NeutArr owns "hunt missing"
  # exclusively (Cleanuparr's own built-in missing-search should be left
  # disabled once NeutArr is configured, so the two don't redundantly
  # search the same libraries against the same indexers - see README).
  # ---------------------------------------------------------------------
  cleanuparr:
    <<: *common
    image: ghcr.io/cleanuparr/cleanuparr:2.9.16
    container_name: cleanuparr
    profiles: [extras]
    networks: [stacknet]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11011/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/cleanuparr:/config
      # Cleanuparr's QueueCleaner/MalwareBlocker jobs need filesystem access
      # to whatever path the download client's own API reports as each queue
      # item's location - now just NzbDAV's, since Decypharr (and the mounts
      # this needed for it) is gone.
      - /mnt/nzbdav:/mnt/nzbdav:rslave
    # No prior observation - generous default ceiling, same reasoning as
    # every other companion app in this file.
    ports:
      - "11011:11011"
    mem_limit: 512m
    mem_reservation: 64m
    cpus: 2

  # Hardened Huntarr-lineage fork (Huntarr itself was abandoned after the
  # original author suppressed reports of an unauthenticated auth-bypass
  # that leaked every connected *arr app's API keys in cleartext - never
  # add Huntarr proper). NeutArr traces through elfhosted/newtarr's fork of
  # the last clean Huntarr release (v6.6.3), with the auth system fully
  # rebuilt and the original security findings addressed.
  neutarr:
    <<: *common
    image: iampuid0/neutarr:1.9.1
    container_name: neutarr
    profiles: [extras]
    networks: [stacknet]
    # No curl (or wget) in this image - confirmed live, the curl-based
    # healthcheck every other app in this file uses just failed with
    # "curl: not found" despite the app itself serving fine (a real 200 on
    # manual check). Uses the venv's own python3 instead, which is present.
    healthcheck:
      test: ["CMD-SHELL", "/venv/bin/python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9705/', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/neutarr:/config
    ports:
      - "9705:9705"
    # Was 512m - confirmed via docker stats/OOMKilled that NeutArr gets
    # killed roughly every 30 minutes at that ceiling despite a modest
    # ~145MB steady-state reading, invisible on any dashboard since
    # restart: unless-stopped just quietly restarts it. Raised with real
    # headroom rather than tightened.
    mem_limit: 1g
    mem_reservation: 64m
    cpus: 2
