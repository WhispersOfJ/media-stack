x-common: &common
  restart: unless-stopped
  environment: &common-env
    PUID: ${PUID}
    PGID: ${PGID}
    TZ: ${TZ}
  logging: &common-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

networks:
  stacknet:
    name: stacknet

services:
  # ---------------------------------------------------------------------
  # Indexing
  # ---------------------------------------------------------------------
  prowlarr:
    <<: *common
    # Pinned to hotio's "release" channel tag rather than :latest - verified
    # equivalent to whatever :latest currently resolves to (same digest), so
    # this is a no-op today; going forward, Watchtower still tracks this
    # channel but the choice is explicit rather than an ambiguous "latest".
    image: ghcr.io/hotio/prowlarr:release
    container_name: prowlarr
    networks: [stacknet]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9696/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "9696:9696"
    # No prior limit at all - found live via a resource audit (docker stats
    # showing the full host ceiling instead of a real number). Sized from
    # observed baseline (~195MB) with real headroom.
    mem_limit: 1g
    mem_reservation: 128m
    cpus: 2

  zilean-postgres:
    restart: unless-stopped
    logging: *common-logging
    image: postgres:18-alpine
    container_name: zilean-postgres
    networks: [stacknet]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ZILEAN_POSTGRES_PASSWORD}
      POSTGRES_DB: zilean
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      # postgres 18+ changed the expected mount point up one level (was /var/lib/postgresql/data);
      # PGDATA is now a version-specific subdir it manages itself (/var/lib/postgresql/18/docker).
      - ./config/zilean-postgres:/var/lib/postgresql
    # Postgres's own defaults are hardware-agnostic (128MB shared_buffers etc)
    # regardless of host. Sized for this host's NVMe + shared-desktop memory
    # budget, not maxed out since Plex/desktop apps also run here.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "max_worker_processes=4"
      - "-c"
      - "max_parallel_workers=4"
      - "-c"
      - "max_parallel_workers_per_gather=2"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
    mem_limit: 2g
    mem_reservation: 256m
    cpus: 4

  zilean:
    restart: unless-stopped
    logging: *common-logging
    # Pinned to the exact version currently running (verified same digest as
    # :latest at pin time) rather than :latest.
    image: ipromknight/zilean:v3.5.0
    container_name: zilean
    networks: [stacknet]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8181/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - zilean-postgres
      - zurg
    environment:
      TZ: ${TZ}
      Zilean__ApiKey: ${ZILEAN_API_KEY}
      Zilean__Database__ConnectionString: "Host=zilean-postgres;Database=zilean;Username=postgres;Password=${ZILEAN_POSTGRES_PASSWORD};Include Error Detail=true;Timeout=30;CommandTimeout=3600;"
      Zilean__Dmm__EnableScraping: "true"
      # Default is 200 - raised so Torznab searches (Prowlarr -> Radarr/
      # Sonarr) surface more cached candidates per query instead of getting
      # cut off, now that Zurg ingestion below adds a second hash source on
      # top of DMM's public hashlist.
      Zilean__Dmm__MaxFilteredResults: "500"
      Zilean__Torrents__EnableEndpoint: "true"
      Zilean__EnableDashboard: "true"
      # Ingests this account's own already-cached Real-Debrid torrents
      # directly from Zurg's /debug/torrents (5,644 entries at time of
      # writing) into Zilean's index - a second hash source alongside DMM's
      # public hashlist, scoped to hashes actually proven cached on this
      # account. Verified live: schema match confirmed against Zilean's own
      # StreamedEntry model (name/hash/size, case-insensitive), and a manual
      # `zilean-scraper generic-sync` run actually ingested them. No
      # equivalent exists for AllDebrid/rclone - Zurg is a purpose-built app
      # with this debug endpoint, rclone's RC API has no matching schema.
      Zilean__Ingestion__EnableScraping: "true"
      Zilean__Ingestion__ZurgInstances__0__Url: "http://zurg:9999"
      Zilean__Ingestion__ZurgInstances__0__EndpointType: "1"
      # Hardware tuning: 16 threads available on this host. Reserve 4 for
      # Plex/desktop/other containers rather than pinning all cores to IMDB
      # title-matching (Zilean's one real CPU-parallel workload).
      Zilean__Imdb__UseAllCores: "false"
      Zilean__Imdb__NumberOfCores: "12"
      # Lucene indexing is "massively faster" per Zilean's own docs, at the
      # cost of ~3GB extra RAM during resyncs - covered by the mem_limit below.
      Zilean__Imdb__UseLucene: "true"
      # .NET Server GC: per-core heaps + parallel collection, the standard
      # throughput-oriented choice for a multi-core backend service
      # (default Workstation GC is tuned for low-latency desktop apps instead).
      DOTNET_gcServer: "1"
      # 3GB hard limit, leaving ~1GB of the 4GB container limit for non-GC
      # (native/thread stack) memory headroom.
      DOTNET_GCHeapHardLimit: "0xC0000000"
    ports:
      - "8181:8181"
    mem_limit: 4g
    mem_reservation: 512m
    cpus: 12

  # ---------------------------------------------------------------------
  # Debrid gateway (Real-Debrid + AllDebrid -> qBittorrent-compatible API
  # for the *arr apps, symlink-only, no real downloading)
  # ---------------------------------------------------------------------
  decypharr:
    <<: *common
    # Pinned to the exact version currently running (verified same digest as
    # :latest at pin time) rather than :latest.
    image: cy01/blackhole:v2.3
    container_name: decypharr
    networks: [stacknet]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8282/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - /mnt:/mnt:rshared
      - ./config/decypharr:/app
      - ./config/decypharr/cache:/cache
    devices:
      - /dev/fuse:/dev/fuse:rwm
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    # Soft ceiling, not a tight fit - observed steady-state is ~540-580MB,
    # the highest baseline of any container besides Zilean/zilean-postgres.
    # No container besides those two had any limit at all before this: one
    # runaway process could otherwise take whatever RAM/CPU it wanted from
    # the same shared-desktop host Zilean's own tuning above already
    # protects for Plex/desktop use.
    ports:
      - "8282:8282"
    mem_limit: 1.5g
    mem_reservation: 256m
    cpus: 4

  # Second, isolated Decypharr instance for AllDebrid only. Decypharr has no
  # per-provider category scoping (a single instance's debrids[] are all
  # available to every category), so the only way to keep AllDebrid
  # exclusive to Sonarr rather than shared with Radarr is a
  # fully separate instance - own port, own config/mount, wired into Sonarr
  # only as a download client.
  decypharr-alldebrid:
    <<: *common
    image: cy01/blackhole:v2.3
    container_name: decypharr-alldebrid
    networks: [stacknet]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8282/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - /mnt:/mnt:rshared
      - ./config/decypharr-alldebrid:/app
      - ./config/decypharr-alldebrid/cache:/cache
    devices:
      - /dev/fuse:/dev/fuse:rwm
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    ports:
      - "8283:8282"
    mem_limit: 1.5g
    mem_reservation: 256m
    cpus: 4

  # ---------------------------------------------------------------------
  # Native-companion containerization (Phase 1 of 2 - see CHANGELOG for the
  # full plan). Zurg mounts pre-existing Real-Debrid content directly at
  # /mnt/zurg for Plex; rclone-alldebrid does the same for AllDebrid at
  # /mnt/all. /mnt:rshared on both means the FUSE mount lands at the literal
  # host path Plex's own library already expects - no path remapping needed.
  # Sponsor image (ghcr.io/debridmediamanager/zurg), not the public
  # zurg-testing image.
  # ---------------------------------------------------------------------
  zurg:
    <<: *common
    image: ghcr.io/debridmediamanager/zurg@sha256:924f1737814a72fddc87f90b2cb3056a0d25ecad4e8789d3d5294cf4e1aa0d07
    container_name: zurg
    networks: [stacknet]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9999/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/zurg/config.yml:/app/config.yml
      - ./config/zurg/data:/app/data
      - ./config/zurg/logs:/app/logs
      - /mnt:/mnt:rshared
    devices:
      - /dev/fuse:/dev/fuse:rwm
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    # Observed a sustained ~20-25% CPU baseline (not a spike) across two
    # samples taken 5s apart - likely its own 10s Real-Debrid poll interval
    # plus serving reads for Plex/the arr apps. Capped well above that
    # baseline rather than tightened, purely so it can't compete unbounded
    # with Plex/desktop use if that baseline ever grows.
    ports:
      - "9999:9999"
    mem_limit: 1g
    mem_reservation: 128m
    cpus: 6

  rclone-alldebrid:
    restart: unless-stopped
    logging: *common-logging
    image: rclone/rclone:1.74.4
    container_name: rclone-alldebrid
    networks: [stacknet]
    environment:
      <<: *common-env
      XDG_CONFIG_HOME: /config
    entrypoint: ["rclone"]
    command:
      - "mount"
      - "all:"
      - "/mnt/all"
      - "--config=/config/rclone/rclone.conf"
      - "--dir-cache-time=10s"
      - "--multi-thread-streams=0"
      - "--cutoff-mode=cautious"
      - "--vfs-cache-mode=minimal"
      - "--network-mode"
      - "--buffer-size=0"
      - "--read-only"
      - "--allow-other"
      - "--allow-non-empty"
    healthcheck:
      test: ["CMD-SHELL", "mountpoint -q /mnt/all && [ -n \"$$(ls -A /mnt/all 2>/dev/null)\" ] || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/rclone/rclone.conf:/config/rclone/rclone.conf:ro
      - /mnt:/mnt:rshared
    devices:
      - /dev/fuse:/dev/fuse:rwm
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    # Same reasoning as zurg above (own FUSE mount, no prior ceiling) but
    # lighter - read-only mount, no Real-Debrid polling of its own.
    mem_limit: 512m
    mem_reservation: 64m
    cpus: 4

  # ---------------------------------------------------------------------
  # *arr apps
  # ---------------------------------------------------------------------
  radarr:
    <<: *common
    image: ghcr.io/hotio/radarr:release
    container_name: radarr
    networks: [stacknet]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/radarr:/config
      # Not the blanket /mnt:/mnt bind Sonarr uses - AllDebrid (/mnt/all) is
      # TV-only, so Radarr only gets the two mounts it actually needs.
      - /mnt/zurg:/mnt/zurg:rslave
      - /mnt/decypharr:/mnt/decypharr:rslave
      - /mnt/nzbdav:/mnt/nzbdav:rslave
      # Same path Decypharr uses internally for its qBittorrent-emulated category
      # folders (/app/downloads/<category>) - identical path avoids needing Remote
      # Path Mappings, per Decypharr's own documented best practice.
      - ./config/decypharr/downloads:/app/downloads:rslave
      # Genuinely writable root folder on regular disk - /mnt/zurg is Zurg's own
      # rclone FUSE mount and does not support having files written into it
      # (confirmed: symlink/hardlink/copy all fail there with I/O errors).
      - ./media/movies:/data/movies
    ports:
      - "7878:7878"
    # No prior limit at all - found live via a resource audit. Sized above
    # observed baseline (~390MB) with real headroom for a 15,000+ title
    # library doing an active scan/import.
    mem_limit: 2g
    mem_reservation: 256m
    cpus: 2

  sonarr:
    <<: *common
    image: ghcr.io/hotio/sonarr:release
    container_name: sonarr
    networks: [stacknet]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/sonarr:/config
      - /mnt:/mnt:rslave
      - ./config/decypharr/downloads:/app/downloads:rslave
      # Sonarr's exclusive AllDebrid path (see the decypharr-alldebrid service comment above) -
      # that instance reports outputPath as /app/downloads/<category>/... to Sonarr's API,
      # identical-looking to the primary decypharr's own path convention above, but it's
      # actually a different host directory (config/decypharr-alldebrid/downloads). Can't bind
      # both at the literal /app/downloads (one container path, one mount), so this one lands
      # at a second path and gets a Remote Path Mapping in Sonarr's own settings instead - the
      # Decypharr-AllDebrid download client's one exception to the "identical paths, no Remote
      # Path Mappings" rule the rest of this stack follows. Found live: every AllDebrid-sourced
      # Sonarr grab was stuck "No files found are eligible for import" with this mount missing.
      - ./config/decypharr-alldebrid/downloads:/app/downloads-ad:rslave
      - ./media/shows:/data/shows
    ports:
      - "8989:8989"
    # No prior limit at all - found live via a resource audit. Sized above
    # observed baseline (~477MB) with real headroom - this instance tracks
    # close to 300,000 episode records (see Known gaps' missing-aired note).
    mem_limit: 2g
    mem_reservation: 256m
    cpus: 2

  # Custom Format / Quality Profile sync from TRaSH Guides, for Sonarr and
  # Radarr only. Runs as a persistent daemon on its
  # own cron schedule rather than a one-shot job, per Recyclarr's own
  # reference docker-compose.yml. Config lives in config/recyclarr/
  # recyclarr.yml - deliberately scoped to only add new custom formats to
  # the existing "Unlimited" quality profile, not create a competing
  # profile or touch the two pre-existing manual block formats (see
  # recyclarr.yml's own comments for why reset_unmatched_scores is left
  # off).
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    restart: unless-stopped
    logging: *common-logging
    container_name: recyclarr
    profiles: [extras]
    networks: [stacknet]
    read_only: true
    tmpfs: [/tmp]
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      CRON_SCHEDULE: "0 6 * * *"  # once daily, 6am
      # Missing since Recyclarr was first added - recyclarr.yml's !env_var
      # RADARR_API_KEY/SONARR_API_KEY directives had nothing to resolve
      # against inside this container. Confirmed live via its own logs:
      # every single scheduled run since at least 2026-07-14 failed at the
      # config-parse stage ("undefined environment variable
      # SONARR_API_KEY"), meaning custom-format/profile sync has never
      # actually run - not a regression, broken since day one.
      RADARR_API_KEY: ${RADARR_API_KEY}
      SONARR_API_KEY: ${SONARR_API_KEY}
    volumes:
      - ./config/recyclarr:/config
    # No prior limit at all - found live via a resource audit. A scheduled
    # sync daemon idling most of the day (~3MB observed) - minimum viable
    # ceiling, not a real constraint.
    mem_limit: 256m
    mem_reservation: 32m
    cpus: 1

  # ---------------------------------------------------------------------
  # Usenet - streaming, no local disk (NzbDAV: WebDAV filesystem + rclone
  # mount, same "virtual filesystem" pattern as Zurg/rclone-alldebrid do
  # for debrid). Replaces NZBGet (real local downloads) as of CHANGELOG
  # [10.1.0] - that approach never actually streamed, it wrote real files
  # to disk, which wasn't the goal.
  # ---------------------------------------------------------------------
  nzbdav:
    restart: unless-stopped
    logging: *common-logging
    image: nzbdav/nzbdav:latest
    container_name: nzbdav
    networks: [stacknet]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./config/nzbdav:/config
      - /mnt:/mnt
      # Repairs feature needs to see the *arr apps' own root folders to scan
      # for symlinks/*.strm and correlate them back to Radarr/Sonarr entries -
      # same /data/movies, /data/shows paths those apps report as their own
      # root folders (see radarr/sonarr services above), so nzbdav's repair
      # engine's path lookups line up with no remapping needed. Only
      # Radarr+Sonarr are wired into the Repairs tab today, so only their root
      # folders are mounted. Read-only - nzbdav repairs via the Radarr/Sonarr
      # API (delete+research), not by touching the symlinks directly.
      - ./media/movies:/data/movies:ro
      - ./media/shows:/data/shows:ro
    # Host port 3001, not 3000 - DebridMediaManager already owns 3000 on
    # this host. Internally still :3000 (Radarr/Sonarr/rclone all reach it
    # as http://nzbdav:3000 over stacknet, unaffected by the host mapping).
    ports:
      - "3001:3000"
    # No prior limit at all - found live via a resource audit. Sized above
    # observed baseline (~369MB) - WebDAV streaming has real per-connection
    # buffering cost. Bumped 1g->2g after a live repair/import batch sat at
    # 62% of the 1g cap mid-run with connection count raised to 20.
    mem_limit: 2g
    mem_reservation: 128m
    cpus: 2

  nzbdav-rclone:
    restart: unless-stopped
    logging: *common-logging
    image: rclone/rclone:1.74.4
    container_name: nzbdav-rclone
    networks: [stacknet]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ./config/nzbdav-rclone/rclone.conf:/config/rclone/rclone.conf:ro
      - /mnt:/mnt:rshared
    devices:
      - /dev/fuse:/dev/fuse:rwm
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    depends_on:
      nzbdav:
        condition: service_healthy
    # Same flag rationale as rclone-alldebrid's own mount above, plus the
    # setup guide's streaming-tuned cache flags (buffer-size=0 avoids
    # double-caching since the OS/Plex already buffer reads; read-ahead
    # sized for smooth playback of high-bitrate remuxes).
    command:
      - "mount"
      - "nzbdav:"
      - "/mnt/nzbdav"
      - "--config=/config/rclone/rclone.conf"
      - "--uid=1000"
      - "--gid=1000"
      - "--allow-other"
      - "--allow-non-empty"
      - "--links"
      - "--use-cookies"
      - "--vfs-cache-mode=full"
      - "--vfs-cache-max-size=20G"
      - "--vfs-cache-max-age=24h"
      - "--buffer-size=0M"
      - "--vfs-read-ahead=512M"
      - "--dir-cache-time=20s"
    healthcheck:
      test: ["CMD-SHELL", "mountpoint -q /mnt/nzbdav || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    mem_reservation: 64m
    cpus: 4

  # ---------------------------------------------------------------------
  # Requests
  # ---------------------------------------------------------------------
  seerr:
    restart: unless-stopped
    logging: *common-logging
    # Digest-pinned rather than a version tag: upstream's last tagged
    # release (v3.0.1) is behind what's actually shipped as :latest (running
    # version reports 3.3.0 via its own API) - no matching tag exists to pin
    # to without downgrading, so this freezes exactly what's running today.
    # Bump this digest deliberately when upstream cuts a new tagged release.
    image: ghcr.io/seerr-team/seerr@sha256:c92d2dc117f62185e7bcb88cd56efd374ea79210eaf433275449e8d5988eb5a8
    container_name: seerr
    networks: [stacknet]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5055/api/v1/status >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      TZ: ${TZ}
    volumes:
      - ./config/seerr:/app/config
    ports:
      - "5055:5055"
    # No prior limit at all - found live via a resource audit. Sized above
    # observed baseline (~72MB).
    mem_limit: 1g
    mem_reservation: 128m
    cpus: 2

  # ---------------------------------------------------------------------
  # Media server. Containerized from a native install in 3.3.0; the native
  # plexmediaserver package, its systemd unit, and /var/lib/plex were fully
  # removed in 4.8.0 - this container is the only Plex on the host now, no
  # rollback fallback kept. See CHANGELOG for both.
  # ---------------------------------------------------------------------
  plex:
    restart: unless-stopped
    logging: *common-logging
    # Official image, not a LinuxServer-style fork - a PUID/PGID-forcing
    # image would recursively chown the ~33GB library to PUID/PGID on first
    # boot (same reason the Kometa entry below avoids the LinuxServer fork).
    # public channel, not Plex Pass (beta) - the official image only
    # publishes the public channel. Deliberate, not an oversight - public
    # channel on the official image is the more conservative choice for a
    # containerized production library anyway.
    # Bump this tag deliberately, not via Watchtower (see below).
    image: plexinc/pms-docker:1.43.3.10828-00f62d37d
    container_name: plex
    # Plex's own guidance for Docker: GDM auto-discovery, DLNA, and
    # remote-access NAT-PMP/UPnP negotiation are all unreliable on bridge
    # networking. Every other service in this stack already publishes
    # directly to 0.0.0.0 with no reverse proxy, so this is a deliberate,
    # documented exception to the stacknet/published-port pattern rather
    # than an inconsistency - no networks:/ports: block, both are invalid
    # alongside network_mode: host.
    network_mode: host
    environment:
      TZ: ${TZ}
      # Matches the uid/gid the native install used to own the library as,
      # so the migrated ~33GB library needed zero chown. The native install
      # is gone now (4.8.0), but this uid/gid still owns config/plex on
      # disk, so it stays.
      PLEX_UID: "955"
      PLEX_GID: "955"
      # Native Arch install set this to a flat directory (no
      # Library/Application Support nesting); set it the same way here so
      # config/plex/Plex Media Server could be copied over verbatim from
      # /var/lib/plex without restructuring it.
      PLEX_MEDIA_SERVER_APPLICATION_SUPPORT_DIR: /config
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:32400/identity || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ./config/plex:/config
      - ./config/plex-transcode:/transcode
      # Both existing library sections (Movies at /mnt/zurg/movies; TV
      # Shows at /mnt/zurg/shows and /mnt/all/magnets - confirmed via the
      # migrated library DB's own section_locations table) resolve under
      # /mnt, so this one mount is exact path parity with what's already in
      # the database - no relinking, no "fix missing files".
      - /mnt:/mnt:rslave
      # Not yet an actual library location in Plex today (verified against
      # the DB), but every arr app's writable root folder lives here and
      # the README has long recommended adding it - mounted now so it's
      # available the moment that's done, at the same absolute path the
      # arr apps themselves use it at.
      - ./media:/home/bear/Stack/media
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    # video/render host GIDs - renderD128 is already world-writable
    # (confirmed: crw-rw-rw-), so this is a defensive fallback rather than
    # strictly required for VAAPI hardware transcoding to work.
    group_add:
      - "983"
      - "987"
    # Caught live during tuning: a library scan alone briefly pushed this to
    # 100% CPU with zero active playback sessions (confirmed via /activities
    # - "Scanning TV Shows", not a transcode). HW transcoding covers
    # play/decode, not scan/analysis/thumbnail passes, so this can spike on
    # its own. 12 of 16 threads leaves the same 4-thread desktop headroom
    # Zilean's own tuning above already reserves.
    mem_limit: 6g
    mem_reservation: 512m
    cpus: 12

  # =======================================================================
  # Optional / recommended extras - start with:
  #   docker compose --profile extras up -d
  # =======================================================================
  # Replaced FlareSolverr in 3.4.0 - same role (Cloudflare challenge solver,
  # registered as Prowlarr's Indexer Proxy), same port, same FlareSolverr-
  # compatible /v1 API (Prowlarr's proxy type is still literally named
  # "FlareSolverr" - only the host URL changed). Uses Camoufox (a
  # Firefox-based anti-detect browser) instead of Selenium +
  # undetected-chromedriver, with a faster patch cadence against Cloudflare's
  # evolving detection signals. See CHANGELOG for the swap and live
  # verification.
  byparr:
    restart: unless-stopped
    logging: *common-logging
    # Digest-pinned rather than a version tag - the project doesn't publish
    # clean vX.Y.Z tags on its GHCR registry the way its GitHub releases
    # suggest (only :latest, :main, and commit-sha/arch-specific tags were
    # actually resolvable at pin time). Same "manually bumped, not on
    # Watchtower's train" reasoning as Plex above either way: this is a
    # security/anti-bot component other indexers depend on, an unattended
    # breaking update is worth avoiding.
    image: ghcr.io/thephaseless/byparr@sha256:01a46a2865d9a6db5eb8ead04ec0dd33b8fbe233e8565ae70b50d4cc0af4cfb0
    container_name: byparr
    profiles: [extras]
    networks: [stacknet]
    # Byparr's own docs: without this, some environments hit a
    # multiprocessing.synchronize error on startup.
    shm_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8191/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      TZ: ${TZ}
    # Defensive, not observed - idle footprint is modest (~130MB) but each
    # Cloudflare solve spins up a real Camoufox (Firefox-based) browser
    # instance, and concurrent solves under real load haven't been tested
    # yet.
    ports:
      - "8191:8191"
    mem_limit: 2g
    mem_reservation: 256m
    cpus: 4

  tautulli:
    <<: *common
    image: ghcr.io/hotio/tautulli:release
    container_name: tautulli
    profiles: [extras]
    networks: [stacknet]
    # Container's own web UI listens internally on Tautulli's default 8181;
    # public port stays 8182.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8181/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/tautulli:/config
    # No prior ceiling - simple companion app, modest observed footprint,
    # cheap insurance.
    ports:
      - "8182:8181"
    mem_limit: 512m
    mem_reservation: 64m
    cpus: 2

  # Plex library lifecycle management - auto-removes watched/stale content on
  # rules configured through its own UI (e.g. "delete movies X days after
  # watched", "remove episodes X days after airing"), keeping the Zurg/
  # Decypharr mount and local ./media footprint from growing unbounded
  # without manual pruning. Complements Seerr (handles the request side);
  # this handles the other end of the lifecycle. All server connections
  # (Plex, Radarr, Sonarr, Seerr) are configured post-boot via its own
  # Settings UI, not environment variables - see README.md's Maintainerr
  # section for the exact setup steps.
  maintainerr:
    restart: unless-stopped
    logging: *common-logging
    image: ghcr.io/maintainerr/maintainerr:latest
    container_name: maintainerr
    profiles: [extras]
    networks: [stacknet]
    # Data dir must be owned by the same uid/gid it runs as (1000:1000,
    # matching PUID/PGID everywhere else in this stack) - it isn't a
    # PUID/PGID-env-var image like the LinuxServer-style ones, it just runs
    # as whatever `user:` is set to.
    user: "${PUID}:${PGID}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6246/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      TZ: ${TZ}
    volumes:
      - ./config/maintainerr:/opt/data
    ports:
      - "6246:6246"
    # No prior ceiling - simple companion app, modest observed footprint,
    # cheap insurance, same reasoning as Tautulli above.
    mem_limit: 512m
    mem_reservation: 64m
    cpus: 2

  # Single dashboard for this stack: live container status/control, host
  # stats, Zilean hash count, one-click ops actions, and a Quick Links panel
  # to every service's own web UI. That last part is what let Heimdall and
  # Homepage (both simple link launchers/widget dashboards, never this
  # stack's ops tool) be removed entirely rather than kept alongside it -
  # see README.md's Dashboard section. Custom build (control-panel/), not a
  # pulled image.
  control-panel:
    build: ./control-panel
    restart: unless-stopped
    logging: *common-logging
    container_name: control-panel
    profiles: [extras]
    networks: [stacknet]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8420/healthz')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    environment:
      PLEX_URL: ${PLEX_URL}
      PLEX_TOKEN: ${PLEX_TOKEN}
      RADARR_API_KEY: ${RADARR_API_KEY}
      SONARR_API_KEY: ${SONARR_API_KEY}
      NZBDAV_API_KEY: ${NZBDAV_API_KEY}
      # Decypharr's own qBittorrent-compatible API requires its own
      # username/password login (POST /api/v2/auth/login for a session
      # cookie) separate from the web UI's cookie session - needed by
      # decypharr_grab() below since use_auth was turned on.
      DECYPHARR_ADMIN_USERNAME: ${DECYPHARR_ADMIN_USERNAME}
      DECYPHARR_ADMIN_PASSWORD: ${DECYPHARR_ADMIN_PASSWORD}
      # Prowlarr has no other integration in this stack (CONTAINER_LABELS
      # dashboard entry only) - added specifically so /api/log-levels can
      # cover all five Servarr-shaped apps, not just the four QUEUE_ARR_APPS.
      PROWLARR_API_KEY: ${PROWLARR_API_KEY}
      # Read-only stat tile only (SELECT COUNT(*) FROM "Torrents") - reuses
      # the same credential Zilean itself already has, no new secret.
      ZILEAN_POSTGRES_PASSWORD: ${ZILEAN_POSTGRES_PASSWORD}
      # Read-only row-count check only (dmm_status()) - reuses the same
      # credential dmm-mysql itself already has, no new secret.
      DMM_MYSQL_ROOT_PASSWORD: ${DMM_MYSQL_ROOT_PASSWORD}
      # notify_test() only - reuses the same webhook every backup/health
      # alert script already posts to, no new secret.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      # Origin/Host validation only (see app.py's verify_same_origin) - not
      # auth, just closing the cross-origin-POST hole given this panel's
      # docker.sock access.
      HOST_IP: ${HOST_IP}
      # Poster sync only (/api/posters/sync) - same key Kometa already uses
      # for its own TMDb metadata, no new secret.
      TMDB_KEY: ${TMDB_KEY}
    volumes:
      # Read-write, unlike Homepage's docker.sock mount above - this one
      # actually execs into containers (Kometa's on-demand run) and issues
      # restarts, not just reads status. Runs as root in-container (no
      # PUID/PGID) since root is what the socket needs; no other privilege
      # escalation beyond that. No auth - LAN-only, matches every other
      # service in this stack (see README.md's Security section); the
      # elevated blast radius here (exec/restart the whole stack from one
      # unauthenticated endpoint) is mitigated by the Origin/Host check
      # below, not by a login gate.
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only additions for the stack-* diagnostic endpoints
      # (resource-check/content-audit/zurg-classify/mount-health/
      # perms-check/backup-verify/etc.) - none of these need write access,
      # only visibility into what's already there.
      - /mnt:/mnt:ro
      - ./config:/host-config:ro
      - /home/daddybear/backups:/host-backups:ro
      - /home/daddybear/Dropbox/stack-restic-repo-offsite:/host-backup-offsite:ro
      # Single-file bind mount, not a directory - confirmed live this
      # session as a real gotcha: Docker binds a specific inode for a
      # single-file mount, not the directory entry, so an editor that
      # replaces the file (write-new-inode-then-rename, which most
      # editors/tools do for atomic writes) leaves the mount pointing at
      # the old, now-unlinked inode. /api/version reported a stale
      # declared version through several README edits until this
      # container was explicitly recreated (`--force-recreate`, not just
      # `up -d` - a plain `up -d` doesn't recreate a container whose own
      # config hasn't changed). If /api/version ever looks stale again,
      # recreate this container before assuming the endpoint logic broke.
      - ./README.md:/host-README.md:ro
    # No prior ceiling despite having docker.sock exec/restart access - a
    # light Flask app, but cheap insurance given its elevated blast radius.
    ports:
      - "8420:8420"
    mem_limit: 512m
    mem_reservation: 64m
    cpus: 2

  # Automated Plex collections/metadata/overlays. Official image only - the
  # LinuxServer fork resets /config ownership to PUID/PGID (or 911:911 if
  # unset) on every start, which the official image doesn't do and most of
  # the wiki's examples assume you're not using anyway. The stable channel is
  # still :latest (not :nightly/:develop) - now digest-pinned since upstream's
  # newest tagged release (v2.4.4) doesn't match what :latest actually ships,
  # so a tag pin would silently jump forward instead of freezing what's
  # running. Bump this digest deliberately when ready to take a newer build.
  # No web UI of its own - runs as a scheduled batch job against Plex's API,
  # so no port is published; see Homepage/Heimdall entries for how it's
  # surfaced there instead.
  kometa:
    restart: unless-stopped
    logging: *common-logging
    image: kometateam/kometa@sha256:98a0df2694edea467ac8870bcecddea3ec0bc14a071721372fb9fa811a829902
    container_name: kometa
    profiles: [extras]
    networks: [stacknet]
    # No run_time is set in config/kometa/config.yml, but the image's default
    # entrypoint (`python3 kometa.py --`) still runs a full pass immediately
    # on every container start/restart regardless - confirmed live (a 19+
    # hour single run since this container's last start, no cron/systemd
    # timer/webhook trigger found anywhere). That's the only thing that ever
    # made this "scheduled" rather than on-demand. Overriding entrypoint to
    # idle instead: Control Panel's /api/kometa/run already runs Kometa
    # on-demand via `docker exec ... python3 /kometa.py --run` (see
    # control-panel/app.py's kometa_run()), which works against an idling
    # container exactly the same as a busy one - exec doesn't care what PID 1
    # is doing. Don't remove this override without re-adding some other guard
    # against the auto-run-on-start behavior, or every restart/host reboot
    # silently kicks off a full run again.
    entrypoint: ["/tini", "-s", "--"]
    command: ["sleep", "infinity"]
    # Matches the command override above - confirms the idle placeholder
    # process is alive, not kometa.py (which now only ever runs via the
    # on-demand exec, not as the container's main process).
    healthcheck:
      test: ["CMD-SHELL", "grep -aq 'sleep infinity' /proc/[1-9]*/cmdline 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      TZ: ${TZ}
    volumes:
      - ./config/kometa:/config
    # 642MB was observed resident during an actual run; idling on the
    # entrypoint override above should sit well under this, but the ceiling
    # is sized for real overlay/poster-generation runs triggered on demand,
    # not the idle baseline.
    mem_limit: 2g
    mem_reservation: 256m
    cpus: 4

  # Web UI (port 7171) for building config/kometa/config.yml interactively -
  # the official Kometa-Team Quickstart wizard, not an alternative Kometa
  # runtime. Its own /config volume is deliberately NOT config/kometa - per
  # Quickstart's own README, that path holds its SQLite db, generated-YAML
  # history, and run logs, and is explicitly documented as not being the
  # Kometa config directory. A config built here has to be copied by hand
  # into config/kometa/config.yml; the kometa service above still owns
  # actually running against that file (Control Panel's on-demand
  # /api/kometa/run exec is unchanged by adding this).
  quickstart:
    restart: unless-stopped
    logging: *common-logging
    image: kometateam/quickstart:latest
    container_name: kometa-quickstart
    profiles: [extras]
    networks: [stacknet]
    environment:
      TZ: ${TZ}
    volumes:
      - ./config/quickstart:/config
    ports:
      - "7171:7171"
    mem_limit: 1g
    mem_reservation: 128m
    cpus: 2

  # Pulls TMDb keywords onto Plex items as labels/genres (e.g. "revenge",
  # "based on a manga") - complements Kometa (collections/overlays) rather
  # than overlapping it; neither touches the other's output. Webhook-enabled
  # as of the 2026-07-18 optimization pass (Plex Pass confirmed already in
  # use - see plex-webhook-listener.py) - PROCESS_TIMER stretched to 24h as
  # a fallback sweep since library.new events now trigger processing within
  # WEBHOOK_DEBOUNCE instead of waiting up to an hour. Registering
  # http://<HOST_IP>:9090/webhook in Plex's own Settings -> Webhooks is a
  # manual, account-level step (same pattern as plex-webhook-listener.py's
  # own webhook, not tracked by this repo) - it is NOT done by this compose
  # change alone.
  labelarr:
    <<: *common
    image: ghcr.io/nullable-eth/labelarr:v1.4.0
    container_name: labelarr
    profiles: [extras]
    networks: [stacknet]
    ports:
      # 127.0.0.1-bound, same exposure pattern as plex-webhook-listener.py's
      # PLEX_WEBHOOK_PORT - Plex sends from the host itself (network_mode:
      # host), and the README's own network-exposure note warns /scan and
      # /webhook carry no auth, so this must never be a bare 9090:9090.
      - "127.0.0.1:9090:9090"
    environment:
      <<: *common-env
      PLEX_TOKEN: ${PLEX_TOKEN}
      # Plex runs network_mode: host (see the plex service above) - every
      # other container reaches it via HOST_IP:32400, never a stacknet
      # hostname. Same pattern control-panel's PLEX_URL and Kometa's own
      # config.yml plex_server_url already use.
      PLEX_SERVER: ${HOST_IP}
      PLEX_PORT: "32400"
      PLEX_REQUIRES_HTTPS: "false"
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN}
      MOVIE_PROCESS_ALL: "true"
      TV_PROCESS_ALL: "true"
      USE_RADARR: "true"
      RADARR_URL: http://radarr:7878
      RADARR_API_KEY: ${RADARR_API_KEY}
      USE_SONARR: "true"
      SONARR_URL: http://sonarr:8989
      SONARR_API_KEY: ${SONARR_API_KEY}
      DATA_DIR: /data
      WEBHOOK_ENABLED: "true"
      WEBHOOK_PORT: "9090"
      WEBHOOK_DEBOUNCE: 30s
      PROCESS_TIMER: 24h
    volumes:
      - ./config/labelarr:/data
    healthcheck:
      test: ["CMD-SHELL", "pgrep labelarr || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 1

  unpackerr:
    restart: unless-stopped
    logging: *common-logging
    # Digest-pinned: upstream's newest tagged release (0.15.2) doesn't match
    # what's actually shipped as :latest - no matching tag exists to pin to
    # without downgrading, so this freezes exactly what's running today.
    # Bump this digest deliberately when ready to take a newer release.
    image: golift/unpackerr@sha256:4ec141eeb0cb2f971d7c92f21cc40b0d2d50d7920eb7a0557443cca52270c0b0
    container_name: unpackerr
    profiles: [extras]
    networks: [stacknet]
    # No web UI/API - checks that the main unpackerr process is still alive
    # via /proc rather than an HTTP probe.
    healthcheck:
      test: ["CMD-SHELL", "grep -aq unpackerr /proc/[1-9]*/cmdline 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      TZ: ${TZ}
      # Was missing every API key below (not just blank - entirely absent), so Unpackerr ran
      # with "0 servers" configured since the day it was added. Confirmed live via its own
      # startup log: "No Starr apps or folders configured."
      UN_RADARR_0_URL: http://radarr:7878
      UN_RADARR_0_API_KEY: ${RADARR_API_KEY}
      UN_SONARR_0_URL: http://sonarr:8989
      UN_SONARR_0_API_KEY: ${SONARR_API_KEY}
      # No UN_READARR entry - Bindery replaced Readarr in v10.7.0 and isn't
      # a supported Unpackerr "Starr app" (too new for that fixed list).
      # Low-impact: ebook releases are rarely RAR'd the way video/audio
      # ones are.
    volumes:
      - /mnt:/mnt:rslave
      # Same mounts every arr app already has (see Sonarr/Radarr above) - /mnt alone doesn't
      # cover it, since each app's queue reports outputPath as /app/downloads/<category>/...,
      # not the /mnt/decypharr/... path the symlink actually resolves through.
      - ./config/decypharr/downloads:/app/downloads:rslave
      - ./config/decypharr-alldebrid/downloads:/app/downloads-ad:rslave
      - ./usenet:/usenet:rslave
    # No prior ceiling - extraction (unzip/unrar) can spike CPU briefly on
    # large archives, cheap insurance same as the other companion apps above.
    mem_limit: 512m
    mem_reservation: 64m
    cpus: 2

  watchtower:
    restart: unless-stopped
    logging: *common-logging
    image: nickfedor/watchtower:1.19.0
    container_name: watchtower
    profiles: [extras]
    networks: [stacknet]
    # No shell in this image (distroless-style) - uses Watchtower's own
    # built-in --health-check flag rather than a wget/curl probe.
    healthcheck:
      test: ["CMD", "/watchtower", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    environment:
      TZ: ${TZ}
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
      # Every actual update (or update failure) now posts to Discord instead
      # of happening silently overnight.
      WATCHTOWER_NOTIFICATIONS: "shoutrrr"
      WATCHTOWER_NOTIFICATION_URL: ${DISCORD_WATCHTOWER_SHOUTRRR_URL}
      WATCHTOWER_NOTIFICATIONS_HOSTNAME: ${HOST_IP}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # No prior ceiling - idle daemon most of the time, cheap insurance
    # despite the docker.sock access it needs to do its job.
    mem_limit: 256m
    mem_reservation: 32m
    cpus: 1

  # ---------------------------------------------------------------------
  # DebridMediaManager (self-hosted) - the app behind debridmediamanager.com,
  # for personal library browsing/organizing/casting plus its own on-demand
  # per-title scraper (search/scrape triggers when a title is viewed in the
  # UI via api/search/title.ts -> api/scrapers/imdb.ts, not a standing
  # crawler - confirmed by reading the actual route source, not assumed).
  # Real-Debrid/AllDebrid/TorBox credentials are entered by the user
  # in-browser (localStorage), never a server-side secret - nothing to
  # configure here for personal library access itself.
  # ---------------------------------------------------------------------
  dmm-mysql:
    restart: unless-stopped
    logging: *common-logging
    # MySQL is hard-required by DMM's own Prisma schema (hardcoded
    # provider = "mysql", plus MySQL-specific column types and @@fulltext
    # indexes) - not swappable for Postgres/MariaDB without real risk.
    image: mysql:9.7
    container_name: dmm-mysql
    profiles: [extras]
    networks: [stacknet]
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${DMM_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: dmm
      MYSQL_USER: dmm
      MYSQL_PASSWORD: ${DMM_MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/dmm-mysql:/var/lib/mysql
      # Not :ro - caught live: MySQL's own entrypoint chowns this directory
      # to the mysql user on every startup and crash-loops if it can't.
      # LOAD DATA INFILE itself only reads from here regardless. Matches
      # MySQL 8.4's secure default (secure_file_priv=/var/lib/mysql-files/,
      # confirmed live) rather than loosening local_infile globally.
      # scripts/import-imdb-data.py writes filtered TSVs here from the host.
      - ./config/dmm-mysql-import:/var/lib/mysql-files/import
    # Bumped from the original personal-scale sizing - stack-imdb-sync.timer
    # now LOAD DATA INFILEs low millions of rows into this instance daily
    # (imdb_title_basics/akas/ratings, filtered to movie/tvSeries/
    # tvMiniSeries - see CHANGELOG), with @@fulltext indexes to maintain on
    # top of that. Still far short of zilean-postgres's own IMDB-scale
    # tuning, but no longer "personal-scale app state only" either.
    mem_limit: 2g
    mem_reservation: 256m
    cpus: 2

  dmm-redis:
    restart: unless-stopped
    logging: *common-logging
    image: redis:8-alpine
    container_name: dmm-redis
    profiles: [extras]
    networks: [stacknet]
    environment:
      TZ: ${TZ}
    # Matches upstream's own reference docker-compose.yml exactly (rate
    # limiting - DMM falls back to in-memory without it, but this is tiny).
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./config/dmm-redis:/data
    mem_limit: 192m
    mem_reservation: 32m
    cpus: 1

  # One-shot schema setup - no migration runner in DMM's own package.json,
  # so first-run schema creation needs `prisma db push` run once against a
  # fresh database (no prisma/migrations history to run `migrate deploy`
  # against). Exits after running; not restart-looped.
  dmm-migrate:
    restart: "no"
    logging: *common-logging
    build:
      context: https://github.com/debridmediamanager/debrid-media-manager.git#c2ceef94477e49ddd5c55606bf57959ffdf29b9e
      # The final (deploy) stage strips devDependencies, including the
      # prisma CLI itself - `npx prisma` there silently downloads a random
      # newer major version off the registry at runtime instead of using
      # the pinned one (caught live: it grabbed prisma@7.8.0 unprompted).
      # The `build` stage still has the full node_modules matching what
      # this exact commit was actually built/tested against.
      target: build
    container_name: dmm-migrate
    profiles: [extras]
    networks: [stacknet]
    command: ["npx", "prisma", "db", "push", "--accept-data-loss"]
    environment:
      TZ: ${TZ}
      DATABASE_URL: mysql://dmm:${DMM_MYSQL_PASSWORD}@dmm-mysql:3306/dmm
    depends_on:
      dmm-mysql:
        condition: service_healthy
    # No prior limit at all - found live via a resource audit. One-shot and
    # transient (restart: "no"), but npx/prisma tooling can be memory-hungry
    # briefly during the actual push - no reservation needed for a job that
    # doesn't run continuously.
    mem_limit: 1g
    cpus: 2

  # Built from source - no pre-built image published anywhere (checked GHCR
  # and Docker Hub, neither has one). Pinned to a specific commit rather
  # than always building `main`, consistent with this stack's pin-everything
  # policy (see README's Image pinning policy) - building an unpinned git
  # ref would be the self-built equivalent of `:latest`. Bump this SHA
  # deliberately when ready to take a newer build.
  debridmediamanager:
    restart: unless-stopped
    logging: *common-logging
    build:
      context: https://github.com/debridmediamanager/debrid-media-manager.git#c2ceef94477e49ddd5c55606bf57959ffdf29b9e
      # target: build, not the default (deploy) stage - caught live: the
      # deploy stage's Prisma Client is generated in the *build* stage
      # without `openssl` installed there, so Prisma can't detect the real
      # OpenSSL version and silently generates the wrong query engine
      # binary (debian-openssl-1.1.x instead of the actual debian-openssl-
      # 3.0.x runtime) - the app then crash-loops on startup unable to find
      # a matching engine. Not fixable via docker-compose alone without
      # either vendoring a modified Dockerfile (loses the clean pin-by-
      # commit setup) or this: run from the `build` stage instead, which
      # has the full toolchain to fix openssl detection and regenerate the
      # client correctly before starting, same reasoning as dmm-migrate.
      target: build
    container_name: debridmediamanager
    profiles: [extras]
    networks: [stacknet]
    # Overrides the deploy stage's `node server.js` (not present here - the
    # build stage never produces .next/standalone) with a fix-then-start:
    # install openssl so Prisma can detect it correctly (plus curl, for the
    # healthcheck below - caught live: without it the app was actually up
    # and serving the whole time, but the healthcheck itself failed with
    # "curl: executable file not found"), regenerate the Prisma client
    # against the actual runtime, then start via the ordinary `next start`
    # (not the standalone server) since this stage has the regular,
    # non-pruned `.next` build output from its own build step.
    # tzdata added alongside openssl/curl - TZ alone doesn't correctly
    # resolve DST/offset without the zoneinfo database present, needed so
    # the "Added" column in DMM's UI shows local time instead of UTC.
    command: >
      sh -c "apt-get update && apt-get install -y -q openssl curl tzdata &&
      rm -rf /var/lib/apt/lists/* && npx prisma generate &&
      npx next start -H 0.0.0.0 -p 3000"
    healthcheck:
      # curl, not wget - confirmed installed via the apt-get above (also
      # matches what upstream's own deploy-stage HEALTHCHECK uses).
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/healthz | grep -qm1 ok || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    environment:
      TZ: ${TZ}
      DATABASE_URL: mysql://dmm:${DMM_MYSQL_PASSWORD}@dmm-mysql:3306/dmm
      REDIS_URL: redis://dmm-redis:6379
      DMM_ORIGIN: ${DMM_ORIGIN}
      DMMCAST_SALT: ${DMMCAST_SALT}
      # Required in practice (not just "optional" like upstream's own
      # .env.example implies) - the scraper can't identify a title without
      # these, so search/scrape won't work until real keys replace the
      # changeme defaults.
      TMDB_KEY: ${TMDB_KEY}
      MDBLIST_KEY: ${MDBLIST_KEY}
      OMDB_KEY: ${OMDB_KEY}
      TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID}
      TRAKT_CLIENT_SECRET: ${TRAKT_CLIENT_SECRET}
      # Reused from Kometa's existing github.token (config/kometa/config.yml) rather than a
      # new PAT - genuinely optional (GitHub API rate-limit relief only), not part of the
      # OAuth-login/sponsor-tier decision made in 6.2.0.
      GH_PAT: ${GH_PAT}
      REAL_DEBRID_OBSERVABILITY_SQLITE_PATH: .data/real-debrid-observability.sqlite
      DMM_MAX_UNCACHED_LINKS: "50"
      REQUEST_TIMEOUT: "5000"
      NEXT_PUBLIC_ANALYTICS_ENABLED: "false"
    depends_on:
      dmm-migrate:
        condition: service_completed_successfully
      dmm-redis:
        condition: service_healthy
    # Higher than a typical "no prior observation" default ceiling since
    # this runs from the `build` stage (full devDependencies present, plain
    # `next start` rather than the leaner standalone server) - the openssl
    # workaround above trades some extra RAM for a correctly-generated
    # Prisma client without vendoring a modified Dockerfile.
    ports:
      - "3000:3000"
    mem_limit: 1.5g
    mem_reservation: 256m
    cpus: 2

  # ---------------------------------------------------------------------
  # Queue cleanup/missing-content automation. Automates what Control
  # Panel's own "unstick" and "search missing" buttons already do by hand -
  # roles deliberately split between the two apps below: Cleanuparr owns
  # strikes/malware-blocking/stalled-cleanup, NeutArr owns "hunt missing"
  # exclusively (Cleanuparr's own built-in missing-search should be left
  # disabled once NeutArr is configured, so the two don't redundantly
  # search the same libraries against the same indexers - see README).
  # ---------------------------------------------------------------------
  cleanuparr:
    <<: *common
    image: ghcr.io/cleanuparr/cleanuparr:2.9.16
    container_name: cleanuparr
    profiles: [extras]
    networks: [stacknet]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11011/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/cleanuparr:/config
      # Was missing entirely - Cleanuparr's QueueCleaner/MalwareBlocker jobs need
      # filesystem access to the actual downloaded files at the same
      # /app/downloads/<category>/... path Decypharr's own qBittorrent-emulated
      # API reports as each queue item's location, same reasoning as Unpackerr's
      # identical mounts above. Confirmed live: without this, both jobs crashed
      # with "System.InvalidOperationException: Sequence contains no elements"
      # on every single scheduled run (every 5 min for QueueCleaner) since at
      # least 2026-07-14 - a file-path lookup against a mount that didn't exist
      # inside this container at all, not a credentials/auth problem despite
      # initially looking like one (Decypharr's own qBittorrent API login and
      # category listing both work fine with the stored admin credentials).
      - ./config/decypharr/downloads:/app/downloads:rslave
      - ./config/decypharr-alldebrid/downloads:/app/downloads-ad:rslave
    # No prior observation - generous default ceiling, same reasoning as
    # every other companion app in this file.
    ports:
      - "11011:11011"
    mem_limit: 512m
    mem_reservation: 64m
    cpus: 2

  # Hardened Huntarr-lineage fork (Huntarr itself was abandoned after the
  # original author suppressed reports of an unauthenticated auth-bypass
  # that leaked every connected *arr app's API keys in cleartext - never
  # add Huntarr proper). NeutArr traces through elfhosted/newtarr's fork of
  # the last clean Huntarr release (v6.6.3), with the auth system fully
  # rebuilt and the original security findings addressed.
  neutarr:
    <<: *common
    image: iampuid0/neutarr:1.9.1
    container_name: neutarr
    profiles: [extras]
    networks: [stacknet]
    # No curl (or wget) in this image - confirmed live, the curl-based
    # healthcheck every other app in this file uses just failed with
    # "curl: not found" despite the app itself serving fine (a real 200 on
    # manual check). Uses the venv's own python3 instead, which is present.
    healthcheck:
      test: ["CMD-SHELL", "/venv/bin/python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9705/', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./config/neutarr:/config
    ports:
      - "9705:9705"
    mem_limit: 512m
    mem_reservation: 64m
    cpus: 2

  # ---------------------------------------------------------------------
  # Monitoring
  # ---------------------------------------------------------------------
  # Replaces Glances (removed in v10.9.9) - hub+agent resource/container
  # monitor, ~10-15MB agent footprint vs Glances/Netdata's much heavier
  # ones. Agent connects to the hub over stacknet via WebSocket (TOKEN +
  # KEY), not the unix-socket variant - simpler given both containers are
  # already on the same compose network. TOKEN/KEY are blank until the hub
  # generates them on first boot (see BESZEL_AGENT_TOKEN/KEY in .env) -
  # the agent just retries the handshake until they're filled in.
  beszel:
    <<: *common
    image: henrygd/beszel:latest
    container_name: beszel
    profiles: [extras]
    networks: [stacknet]
    environment:
      APP_URL: http://${HOST_IP}:8090
      USER_EMAIL: ${BESZEL_USER_EMAIL}
      USER_PASSWORD: ${BESZEL_USER_PASSWORD}
    # No healthcheck - image is scratch-based (no /bin/sh, no curl/wget),
    # confirmed live: CMD-SHELL fails outright with "exec: /bin/sh: no such
    # file or directory" despite the endpoint itself answering fine on a
    # manual curl from the host. Same class of issue as neutarr's missing
    # curl, but this image has no fallback binary to exec into either.
    volumes:
      - ./config/beszel:/beszel_data
    ports:
      - "8090:8090"
    mem_limit: 256m
    mem_reservation: 32m
    cpus: 1

  beszel-agent:
    <<: *common
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    profiles: [extras]
    networks: [stacknet]
    depends_on:
      beszel:
        condition: service_started
    environment:
      HUB_URL: http://beszel:8090
      TOKEN: ${BESZEL_AGENT_TOKEN}
      KEY: ${BESZEL_AGENT_KEY}
    volumes:
      - ./config/beszel-agent:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 128m
    mem_reservation: 16m
    cpus: 1
