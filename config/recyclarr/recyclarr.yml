    # sizes: WEB/HDTV only, 720p ceiling, Bluray/Remux/1080p+/2160p omitted
    # entirely so they come back disabled (confirmed via recyclarr's own
    # QualityItemOrganizer - qualities left out of this list are explicitly
    # set Allowed=false, not merely reordered). Same shared-instance
    # quality_definition caveat as the profiles above applies here too -
    # this profile controls resolution/source tier only, not an independent
    # file-size ceiling.
    quality_profiles:
      - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
      - trash_id: fd161a61e3ab826d3a22d53f935696dd # Remux + WEB 2160p
      - name: Low Quality
        upgrade:
          allowed: true
          until_quality: WEB 720p
        qualities:
          - name: WEB 720p
            qualities:
              - WEBRip-720p
              - WEBDL-720p
          - name: HDTV-720p
          - name: WEB 480p
            qualities:
              - WEBRip-480p
              - WEBDL-480p
          - name: SDTV
