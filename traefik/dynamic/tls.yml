# Dynamic file-provider config - git-tracked (cert/key are files on disk,
# not secrets embedded in this yaml). The mkcert-issued local CA cert
# covers *.cave.internal - install the CA root (config/traefik/certs
# README note, or `mkcert -CAROOT` on this host) on any other device that
# should see a trusted padlock instead of a self-signed warning.
tls:
  certificates:
    - certFile: /etc/traefik/certs/cave.internal.crt
      keyFile: /etc/traefik/certs/cave.internal.key
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/cave.internal.crt
        keyFile: /etc/traefik/certs/cave.internal.key
